<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Module — Working Prototype (PRD v2.6)</title>
<style>
:root{
  --brand:#662d91; --brand-d:#4a148c; --brand-t:#f4e9fa; --accent:#e91e63;
  --bg:#f5f4f8; --card:#fff; --ink:#211c2e; --muted:#6d6680; --line:#e6e1ee;
  --ok:#177245; --ok-bg:#e6f4ea; --warn:#8a6100; --warn-bg:#fdf3d7;
  --err:#a32020; --err-bg:#fbe6e6; --info:#1a4d8f; --info-bg:#e8eefb;
  --grey:#5f5f5f; --grey-bg:#eeeeee;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:96px}
h3,h4{margin:0}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.nav{background:var(--brand);border-bottom:3px solid var(--accent);padding:8px 16px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.nav .brand{color:#fff;font-weight:700;font-size:15px}
.nav .sub{color:#e2d3f0;font-size:11px}
.roles{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden}
.roles button{background:transparent;color:#fff;border:0;padding:6px 12px;font-size:12px}
.roles button.on{background:#fff;color:var(--brand);font-weight:600}
.navbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;font-size:12px}
.navbtn:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hd .n{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.hd h3{font-size:16px}.hd p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.rail{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rail div{flex:1 1 0;min-width:104px;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}
.rail div b{width:19px;height:19px;border-radius:5px;background:#eae6f0;color:#7b7290;display:flex;
  align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
.rail div.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rail div.on b{background:#fff;color:var(--brand)}
.rail div.done{background:var(--ok-bg);border-color:#cfe6d6;color:var(--ok)}
.rail div.done b{background:var(--ok);color:#fff}
.rail div.skip{opacity:.4}
table{width:100%;border-collapse:collapse}
th{background:var(--brand-t);color:var(--brand-d);font-size:11px;text-align:left;padding:9px;font-weight:600}
td{padding:9px;border-bottom:1px solid #f2eff7;font-size:13px;vertical-align:middle}
tr.inv td{background:#faf8fc;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.p-grey{background:var(--grey-bg);color:var(--grey)}.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}.p-err{background:var(--err-bg);color:var(--err)}
.p-info{background:var(--info-bg);color:var(--info)}.p-brand{background:var(--brand-t);color:var(--brand-d)}
.msg{display:flex;gap:8px;padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:8px;align-items:flex-start}
.m-ok{background:var(--ok-bg);color:var(--ok)}.m-err{background:var(--err-bg);color:var(--err)}
.m-warn{background:var(--warn-bg);color:var(--warn)}.m-info{background:var(--info-bg);color:var(--info)}
.open-pt{font-size:11.5px;background:#fffbea;border:1px dashed #d8b100;color:#6b5200;border-radius:8px;padding:7px 10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px}
.btn:hover{background:#f7f5fa}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-d)}
.btn.dan{background:#fff;color:var(--err);border-color:#e8c4c4}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:600;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:110px;background:#fff}
.f .err{font-size:11px;color:var(--err)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:#fff}
.kpi b{display:block;font-size:19px;color:var(--brand-d)}.kpi span{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.box{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.box.insp{background:#faf6fd;border-color:#e2d4f0}
.box.iss{background:#fdf5f5;border-color:#f0cfcf}
.mini{width:70px}
.attr{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.attr .nm{font-weight:600;min-width:118px;font-size:13px}
.attr .ex{flex:1 1 170px;font-size:12px;color:var(--muted)}
.attr.ok{background:#f5faf6;border-color:#d4e8da}.attr.bad{background:#fdf5f5;border-color:#f0cfcf}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.tabs .ct{background:#eee;color:#666;border-radius:20px;padding:0 6px;font-size:11px;font-weight:700;margin-left:6px}
.tabs button.on .ct{background:#fff;color:var(--brand)}
.chev{cursor:pointer;color:var(--brand);font-weight:700}
.disp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.d{border-radius:9px;padding:10px;color:#fff;text-align:center}
.d b{display:block;font-size:18px}.d span{font-size:10.5px;opacity:.92}
.d1{background:#177245}.d2{background:#1565c0}.d3{background:#c96a00}.d4{background:#b3261e}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.chip{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:#fff;display:flex;gap:8px}
.chip.on{border-color:var(--brand);background:#faf6fd}
.chip b{font-size:12.5px}.chip .h{font-size:11.5px;color:var(--muted)}
.ch-crit{background:var(--err-bg);border-left:4px solid var(--err)}
.ch-mat{background:var(--warn-bg);border-left:4px solid var(--warn)}
.ch-info{background:var(--info-bg);border-left:4px solid var(--info)}
.ch-add{background:var(--ok-bg);border-left:4px solid var(--ok)}
.ch-del{background:var(--grey-bg);border-left:4px solid var(--grey);text-decoration:line-through;opacity:.75}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 16px;display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;z-index:40}
.toasts{position:fixed;top:60px;right:14px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;
  padding:9px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,94vw);background:#fff;border-left:1px solid var(--line);
  box-shadow:-8px 0 26px rgba(0,0,0,.12);z-index:80;padding:16px;overflow:auto}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:70}
.modal{position:fixed;z-index:90;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,94vw);
  background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:18px;max-height:88vh;overflow:auto}
.hide{display:none!important}
.sec{font-size:11.5px;font-weight:700;color:var(--muted);margin:14px 0 7px}
pre{background:#f7f5fa;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;margin:0}
.bx{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;
  padding:5px 9px;margin:0 6px 6px 0;background:#fff;cursor:pointer;font-size:12px}
.bx:hover{background:#f7f5fa}
.bx.ok{border-color:#cfe6d6;background:#f4fbf6}
.bx.iss{border-color:#f0cfcf;background:#fdf5f5}
.bx.insp{box-shadow:inset 3px 0 0 var(--brand)}
</style>
</head>
<body>

<div class="nav">
  <div><div class="brand">QC Module — Inbound GR &amp; Quality Control</div>
    <div class="sub" id="ctx">Working prototype · PRD v2.6</div></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="roles" id="roles">
      <button data-a="role" data-r="op" class="on">QC Operator</button>
      <button data-a="role" data-r="tl">Team Lead</button></div>
    <button class="navbtn" data-a="toIntake">Consignments</button>

  </div>
</div>

<div class="wrap"><div id="rail"></div><div id="app"></div></div>

<div class="ovl hide" id="ovl" data-a="closeAll"></div>

<script>
/* ==========================================================================
   QC Module — working prototype, PRD v2.6
   IMPORTANT BUSINESS RULE HONOURED THROUGHOUT:
   the total number of boxes is never known, assumed or calculated.
   Every metric in Sample QC and Receiving derives only from boxes actually
   scanned. The inspection target is derived from QUANTITY / units-per-box,
   which is legitimate, and is never expressed as a share of a total.
   ========================================================================== */

const CFG = { samplePct:10, sampleCap:5, escPct:20, windowDays:15, lockMins:15, mfgFloorDays:900 };
const CFG_AUDIT = [];
const TODAY = new Date();
const dOff = n => { const d=new Date(TODAY); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const daysTo = iso => Math.round((new Date(iso)-TODAY)/86400000);
const gap = (a,b) => Math.abs(Math.round((new Date(a)-new Date(b))/86400000));
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '—';

/* ---- EAN / UPC check digit — all supported symbologies ---- */
function genCheck(d){ let s=0,w=3; for(let i=d.length-1;i>=0;i--){ s+=(+d[i])*w; w=w===3?1:3; } return (10-(s%10))%10; }
function upceBody(e){ const N=e[0],d=e.slice(1,7),l=d[5];
  if('012'.includes(l)) return N+d[0]+d[1]+l+'0000'+d[2]+d[3]+d[4];
  if(l==='3') return N+d[0]+d[1]+d[2]+'00000'+d[3]+d[4];
  if(l==='4') return N+d[0]+d[1]+d[2]+d[3]+'00000'+d[4];
  return N+d[0]+d[1]+d[2]+d[3]+d[4]+'0000'+l; }
function validateEan(raw){
  const c=String(raw||'').trim();
  if(!c) return {ok:false,why:'Enter or scan an EAN'};
  if(!/^\d+$/.test(c)) return {ok:false,why:'Not a valid EAN — non-numeric characters'};
  if(c.length===13) return genCheck(c.slice(0,12))===+c[12]?{ok:true,sym:'EAN-13'}:{ok:false,why:'Not a valid EAN — check digit failed (EAN-13)'};
  if(c.length===12) return genCheck(c.slice(0,11))===+c[11]?{ok:true,sym:'UPC-A'}:{ok:false,why:'Not a valid EAN — check digit failed (UPC-A)'};
  if(c.length===8){ if(genCheck(c.slice(0,7))===+c[7]) return {ok:true,sym:'EAN-8'};
    if(genCheck(upceBody(c))===+c[7]) return {ok:true,sym:'UPC-E'};
    return {ok:false,why:'Not a valid EAN — check digit failed (EAN-8 / UPC-E)'}; }
  return {ok:false,why:`Not a valid EAN — length ${c.length} matches no supported symbology`};
}
const mkEan = b => b+genCheck(b);
const E = { PCO:mkEan('890123400001'), LVN:mkEan('890123400002'), SWG:mkEan('890123400003'),
  NIH:mkEan('890123400004'), HRC:mkEan('890123400005'), SHM:mkEan('700111000001'),
  OIL:mkEan('700111000002'), DAB:mkEan('810222000001'), MULTI:mkEan('890123450001'),
  UPCA:mkEan('03600029145'), ORPHAN:mkEan('890123499999') };
const EAN_MAP = [
  {ean:E.PCO,sku:'MRC-PCO-200'},{ean:E.LVN,sku:'MRC-LVN-100'},{ean:E.SWG,sku:'MRC-SWG-250'},
  {ean:E.NIH,sku:'MRC-NIH-100'},{ean:E.HRC,sku:'MRC-HRC-400'},{ean:E.SHM,sku:'SUN-SHM-200'},
  {ean:E.OIL,sku:'SUN-OIL-500'},{ean:E.DAB,sku:'DAB-HNY-250'},{ean:E.UPCA,sku:'MRC-LVN-100'},
  {ean:E.MULTI,sku:'MRC-NIH-100'},{ean:E.MULTI,sku:'MRC-NIH-200'} ];
const SKU = {
  'MRC-PCO-200':{d:'Parachute Coconut Oil 200ml',mrp:99,i:'🥥'}, 'MRC-LVN-100':{d:'Livon Silk Serum 100ml',mrp:245,i:'✨'},
  'MRC-SWG-250':{d:'Set Wet Hair Gel 250ml',mrp:180,i:'🧴'},     'MRC-NIH-100':{d:'Nihar Naturals Oil 100ml',mrp:55,i:'🌿'},
  'MRC-NIH-200':{d:'Nihar Naturals Oil 200ml',mrp:95,i:'🌿'},    'MRC-HRC-400':{d:'Hair & Care Oil 400ml',mrp:210,i:'🧴'},
  'SUN-SHM-200':{d:'Herbal Shampoo 200ml',mrp:145,i:'🧼'},       'SUN-OIL-500':{d:'Herbal Hair Oil 500ml',mrp:260,i:'🫗'},
  'DAB-HNY-250':{d:'Honey 250g',mrp:180,i:'🍯'},                 'MRC-BOD-150':{d:'Body Lotion 150ml',mrp:175,i:'🧴'} };
const FRESH = { 'MRC-PCO-200':{module:'month',value:3}, 'MRC-LVN-100':{module:'days',value:90},
  'MRC-SWG-250':{module:'month',value:2}, 'SUN-SHM-200':{module:'days',value:60},
  'SUN-OIL-500':{module:'month',value:2}, 'DAB-HNY-250':{module:'month',value:4} };
const ELIG = {'MRC-PCO-200':true,'MRC-LVN-100':false,'MRC-SWG-250':false,'MRC-NIH-100':false,
  'MRC-HRC-400':false,'SUN-SHM-200':false,'SUN-OIL-500':false,'DAB-HNY-250':true,'MRC-BOD-150':false};

const RECEIPT_PANEL = new Set();     // UIDs flagged damaged at unloading (box level, status only)
const SAP_BATCH_REG = {};            // 'SKU|VB' -> batch_id, owned by SAP
const SAP_LOG = [];
let sapSeq=700, uidSeq=88400, evtSeq=0, subSeq=0, ibdSeq=0;

function mkLine(o){
  const m=SKU[o.sku];
  const L=Object.assign({desc:m.d, img:m.i, masterMRP:m.mrp, invoiceMRP:m.mrp,
    eligible:false, status:'new', lockedBy:null, physMRP:'', rekeyed:false,
    ident:{MRP:null,'MFG/EXP':null,SKU:null,Image:null,Description:null},
    flags:[], batches:[], boxes:[], escalated:false, nsm:null, e42Note:null,
    postedQty:0, shortClosed:null, grns:[], selected:true, forceErr:false,
    ackChange:false, change:null, ackShortQty:false}, o);
  // generous UID pool; its length is never surfaced and never used in a metric
  L.uidPool = Array.from({length:40},()=>'UID-'+(++uidSeq));
  return L;
}
function seed(){
  const S={
    A:{po:'4500098231',inv:'INV-A-88123',plant:'DC-Bhiwandi',dock:'Dock 3',whse:'DC-BHIWANDI',
       vendor:{name:'Marico Ltd',configured:true,qr:true},
       ibdConfirm:true, ibds:[
         /* open quantities chosen so both IWDC IBDs fill, each leaves a shortfall
            because a box cannot be split, and a remainder still reaches TGDC */
         {id:'IBD-1001',loc:'IWDC',open:38, whse:'CROSS-DOCK-A'},
         {id:'IBD-1002',loc:'IWDC',open:30, whse:'CROSS-DOCK-B'},
         {id:'IBD-1003',loc:'TGDC',open:300,whse:'DC-BHIWANDI'}],
       lines:[
      mkLine({sku:'MRC-PCO-200',ean:E.PCO,invQty:60,poQty:60,pack:10,plan:[{vb:'VB-7781',mfg:-120,exp:400}]}),
      mkLine({sku:'MRC-LVN-100',ean:E.LVN,invQty:120,poQty:120,pack:4,
              plan:[{vb:'VB-3310',mfg:-300,exp:430},{vb:'VB-3311',mfg:-380,exp:61},{vb:'VB-3310',mfg:-250,exp:380}]}),
      mkLine({sku:'MRC-SWG-250',ean:E.SWG,invQty:120,poQty:110,pack:12,invoiceMRP:175,plan:[{vb:'VB-5502',mfg:-150,exp:380}]}),
      mkLine({sku:'MRC-NIH-100',ean:E.NIH,invQty:2000,poQty:2000,pack:20,plan:[{vb:'VB-9004',mfg:-90,exp:420}]}),
      mkLine({sku:'MRC-HRC-400',ean:E.HRC,invQty:80,poQty:80,pack:8,plan:[{vb:'VB-6620',mfg:-200,exp:360}]})]},
    B:{po:'4500077310',inv:'INV-B-4471',plant:'DC-Bhiwandi',dock:'Dock 3',whse:'DC-BHIWANDI',
       vendor:{name:'Sunrise Traders',configured:true,qr:false},
       ibdConfirm:true, ibds:[],                       /* scenario 2 — confirmation, no IBD */
       lines:[
      mkLine({sku:'SUN-SHM-200',ean:E.SHM,invQty:96,poQty:96,pack:8,plan:[]}),
      mkLine({sku:'SUN-OIL-500',ean:E.OIL,invQty:120,poQty:120,pack:12,plan:[]})]},
    D:{po:'4500066220',inv:'INV-D-7781',plant:'DC-Bhiwandi',dock:'Dock 3',whse:'DC-BHIWANDI',
       vendor:{name:'Dabur India',configured:true,qr:true},
       ibdConfirm:false, ibds:[],                      /* scenario 1 — no confirmation, no IBD */
       lines:[ mkLine({sku:'DAB-HNY-250',ean:E.DAB,invQty:72,poQty:72,pack:12,plan:[{vb:'VB-2200',mfg:-60,exp:500}]}) ]},
    C:{po:'4500000111',inv:'INV-C-0001',plant:'DC-Bhiwandi',dock:'Dock 3',whse:'DC-BHIWANDI',
       vendor:{name:'Unregistered Vendor',configured:false,qr:false}, ibdConfirm:false, ibds:[], lines:[]}
  };
  RECEIPT_PANEL.add(S.A.lines[1].uidPool[1]);
  RECEIPT_PANEL.add(S.A.lines[0].uidPool[2]);
  RECEIPT_PANEL.add(S.B.lines[0].uidPool[1]);
  return S;
}
let SCN = seed();

let E42_QUEUE=[
  {key:'A',sku:'MRC-SWG-250',cls:'mat',field:'Invoice quantity',from:120,to:96,apply:l=>{l.invQty=96;}},
  {key:'A',sku:'MRC-LVN-100',cls:'mat',field:'Invoice MRP',from:245,to:249,apply:l=>{l.invoiceMRP=249;}},
  {key:'A',sku:null,cls:'add',field:'New line',from:'—',to:'MRC-BOD-150',add:true},
  {key:'A',sku:'MRC-NIH-100',cls:'crit',field:'SKU / material code',from:'MRC-NIH-100',to:'MRC-NIH-200',
   apply:l=>{l.sku='MRC-NIH-200';const m=SKU['MRC-NIH-200'];l.desc=m.d;l.masterMRP=m.mrp;l.invoiceMRP=m.mrp;}},
  {key:'A',sku:'MRC-PCO-200',cls:'del',field:'Line removed in E42',from:'present',to:'removed',del:true}];
const CH={crit:{c:'ch-crit',l:'Critical change',i:'!',p:'p-err'},mat:{c:'ch-mat',l:'Material change',i:'~',p:'p-warn'},
  info:{c:'ch-info',l:'Informational',i:'i',p:'p-info'},add:{c:'ch-add',l:'New line',i:'+',p:'p-ok'},
  del:{c:'ch-del',l:'Removed in E42',i:'x',p:'p-grey'}};

const CODES=[{c:'EAN',blk:true,h:'EAN does not match the line, or is wrong/unreadable on the pack'},
  {c:'SKU',blk:true,h:'Physical product is not the ordered SKU'},
  {c:'MFG/EXP',blk:false,h:'Dates wrong, illegible, or contradicting the QR'},
  {c:'Image',blk:true,h:'Product does not match the master image'},
  {c:'Description',blk:true,h:'Pack text contradicts the master description'},
  {c:'MRP',blk:true,h:'MRP on pack does not match the order or invoice'},
  {c:'Damage',blk:false,h:'Physical damage to product or shipper. Photo required.',img:true}];
const codeOf=c=>CODES.find(x=>x.c===c);
const IDENT=['MRP','MFG/EXP','SKU','Image','Description'];
let PROBLEMS=[], SUBS=[];

let S={role:'op',screen:'intake',key:'A',lineId:null,started:false,tab:'pending',open:{},
  refresh:null,draft:null,back:null,regFilter:'',pendingQR:null,nqForm:null,boxModal:null,
  delConfirm:null,user:'aditya.op',alloc:null};

/* ---- derived ---- */
const cons=()=>SCN[S.key];
const lines=()=>cons().lines;
const line=id=>{for(const k in SCN){const f=SCN[k].lines.find(l=>l.id===id);if(f)return f;}return null;};
const cur=()=>line(S.lineId);
const isQR=l=>SCN[l.ckey].vendor.qr;
const remaining=l=>Math.max(0,l.invQty-l.postedQty);
const live=l=>l.boxes.filter(b=>!b.deleted);
const boxIssues=b=>b.issues.length||b.dmg>0||b.rtv>0||b.short>0||b.excess>0;
const lineProbs=l=>PROBLEMS.filter(p=>p.lineId===l.id);
const openProbs=l=>lineProbs(l).filter(p=>p.status==='open');
const identDone=l=>IDENT.every(k=>l.ident[k]==='ok');
const sal=b=>Math.max(0,b.qty-b.short+b.excess-b.dmg-b.rtv);

/* units per box: QR -> pack from the label; Non-QR -> the declared Saleable Qty */
function unitsPerBox(l){
  if(isQR(l)) return l.pack;
  return l.batches.length ? l.batches[0].saleableQty : null;   // undetermined until a batch exists
}
/* inspection target — derived from QUANTITY, never from a count of boxes */
function sampling(l){
  const u=unitsPerBox(l);
  if(!u) return {undetermined:true};
  const qcQty=l.invQty*CFG.samplePct/100;
  const boxesFor=Math.max(1,Math.ceil(qcQty/u));
  return {qcQty,boxesFor,u,cap:CFG.sampleCap,target:Math.min(boxesFor,CFG.sampleCap),capBinds:boxesFor>CFG.sampleCap};
}
const inspected=l=>live(l).filter(b=>b.insp);
function defectRate(l){ const i=inspected(l); return i.length?Math.round(100*i.filter(boxIssues).length/i.length):0; }
/* metrics — derived only from boxes actually scanned */
function metrics(l){
  const b=live(l), iss=b.filter(boxIssues).length;
  return {scanned:b.length, issues:iss, accepted:b.length-iss,
          qty:b.reduce((a,x)=>a+sal(x),0), dmg:b.reduce((a,x)=>a+x.dmg,0), rtv:b.reduce((a,x)=>a+x.rtv,0)};
}
function freshnessAPI(sku,exp){
  const c=FRESH[sku];
  if(!c) return {pass:true,reason:'no criteria maintained — default pass',criteria:'—'};
  const need=c.module==='month'?c.value*30:c.value, left=daysTo(exp);
  return {pass:left>=need,left,need,criteria:`${c.value} ${c.module}`,
    reason:left>=need?`${left}d left vs ${need}d required`:`only ${left}d left, ${need}d required`};
}
const getBatch=(l,vb)=>l.batches.find(b=>b.vb===vb);
function addBatch(l,vb,mfg,exp,saleableQty,extra){
  let b=getBatch(l,vb); if(b) return b;
  b=Object.assign({vb,mfg,exp,saleableQty,sapBatchId:null,dmgQty:0,rtvQty:0,unresolved:false},extra||{});
  l.batches.push(b); return b;
}
const batchBoxes=(l,b)=>live(l).filter(x=>x.vb===b.vb);
const batchQty=(l,b)=>batchBoxes(l,b).reduce((a,x)=>a+sal(x)+x.dmg+x.rtv,0);

/* ---- ui helpers ---- */
const $=s=>document.querySelector(s), all=s=>[...document.querySelectorAll(s)];
const app=()=>$('#app');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m,k){const t=document.createElement('div');t.className='toast '+(k||'');t.textContent=m;
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
const STAT={new:['Not started','p-grey'],prog:['In progress','p-warn'],nsm:['No SKU Match','p-err'],
  prob:['Problem raised','p-err'],qc:['QC complete, awaiting GR','p-ok'],failed:['In a failed submission','p-err'],
  part:['Partially posted','p-info'],full:['Fully posted','p-grey'],short:['Short-closed','p-grey'],removed:['Removed in E42','p-grey']};
const statPill=s=>`<span class="pill ${STAT[s][1]}">${STAT[s][0]}</span>`;
const hd=(n,t,p)=>`<div class="hd">${n!==null?`<div class="n">${n}</div>`:''}<div><h3>${t}</h3><p>${p}</p></div></div>`;
const kpi=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;

/* ==========================================================================
   ROUTER
   ========================================================================== */
function go(s){ if(s) S.screen=s; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){
  all('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.role));
  $('#ctx').textContent=(S.role==='op'&&S.screen==='intake')?'Working prototype · PRD v2.6'
    :`PO ${cons().po} · ${cons().vendor.name} · ${cons().vendor.qr?'QR flow':'Non-QR flow'}`;
  renderRail(); renderScreen(); renderFoot(); renderModal();
}
function renderRail(){
  const r=$('#rail');
  if(S.role!=='op'||S.screen==='reg'){r.innerHTML='';return;}
  const st=[['intake','Intake',0],['worklist','Worklist',1],['ident','Identity',2],['sample','Sample QC',3],['recv','Receiving',4]];
  const o=st.map(x=>x[0]), l=S.lineId?cur():null, skip=l&&l.eligible;
  const at=o.indexOf(['prob','nsm'].includes(S.screen)?(S.back||'worklist'):S.screen);
  r.innerHTML='<div class="rail">'+st.map(x=>{const i=o.indexOf(x[0]);
    let c=i===at?'on':i<at?'done':''; if(skip&&['ident','sample'].includes(x[0]))c+=' skip';
    return `<div class="${c}"><b>${x[2]}</b><span>${x[1]}</span></div>`;}).join('')+'</div>';
}
function renderScreen(){
  if(S.screen==='reg') return renderReg();
  if(S.role==='tl') return renderTL();
  ({intake:renderIntake,worklist:renderWork,ident:renderIdent,sample:renderSample,
    recv:renderRecv,prob:renderProb,nsm:renderNSM}[S.screen]||renderIntake)();
}
function renderFoot(){
  const f=$('#foot'); f.innerHTML='';
  if(S.screen==='reg'){f.innerHTML='<button class="btn" data-a="closeReg">Back</button>';return;}
  if(S.role==='tl'){
    if(S.tab==='pending'){const n=tlLines('pending').filter(l=>l.selected).length;
      f.innerHTML=`<span class="note">${n} line(s) selected · submission is all-or-nothing (native in SAP)</span>
        <button class="btn" data-a="ibdCheck">Run IBD check</button>
        <button class="btn pri" data-a="submit" ${n?'':'disabled'}>Post goods receipt</button>`;
    } else if(S.tab==='repush'){const n=SUBS.filter(x=>x.state==='rejected').length;
      f.innerHTML=`<span class="note">${n} rejected submission(s)</span><button class="btn pri" data-a="repushAll" ${n?'':'disabled'}>Repush all</button>`;
    } else f.innerHTML=`<span class="note">${SUBS.filter(x=>x.state==='posted').length} posted submission(s)</span>`;
    return;
  }
  if(S.screen==='worklist'){const d=lines().filter(l=>['qc','failed','part','full','short'].includes(l.status)).length;
    f.innerHTML=`<span class="note">${d} of ${lines().length} lines with the Team Lead</span>
      <button class="btn" data-a="role" data-r="tl">Open Team Lead panel →</button>`;
  } else if(['ident','sample','recv'].includes(S.screen))
    f.innerHTML='<button class="btn" data-a="release">← Back to worklist</button>';
}

/* ==========================================================================
   SCREEN 0 — INTAKE
   ========================================================================== */
function renderIntake(){
  const o=Object.keys(SCN).map(k=>{const c=SCN[k];
    return `<option value="${k}">${c.po} — ${c.vendor.name}${c.vendor.configured?(c.vendor.qr?' (QR)':' (Non-QR)'):' (not configured)'}</option>`;}).join('');
  app().innerHTML=`<div class="card">
    ${hd(0,'Start a consignment','Gate 1 checks the vendor is configured. The QR flag then selects the flow.')}
    <div class="row">
      <div class="f"><label>Consignment</label><select id="pick">${o}</select></div>
      <div class="f"><label>Purchase order</label><input id="po"></div>
      <div class="f"><label>Invoice</label><input id="inv"></div>
      <button class="btn pri" data-a="check">Run checks</button></div>
    <div id="out" style="margin-top:14px"></div></div>`;
  const fill=()=>{const c=SCN[$('#pick').value];$('#po').value=c.po;$('#inv').value=c.inv;$('#out').innerHTML='';};
  $('#pick').onchange=fill; fill();
}
const chk=(ok,t)=>`<span class="pill ${ok?'p-ok':'p-err'}" style="margin:0 6px 6px 0">${ok?'✓':'✕'} ${t}</span>`;
function doCheck(){
  S.key=$('#pick').value; const c=cons();
  let h=`<div class="sec">E42 gate-in &amp; sanity</div><div>${chk(1,'Invoice gated in')}${chk(1,'Vendor found')}${chk(1,'GSTN match')}${chk(1,'PO ↔ location')}</div>
    <div class="sec">Gate 1 — Green Channel configuration</div><div>${chk(c.vendor.configured,'Vendor maintained in dc_qc_config_green_channel')}</div>`;
  if(!c.vendor.configured){
    h+=`<div class="msg m-err"><b>✕</b><div><b>Hard block — this consignment cannot be received.</b><br>
      ${c.vendor.name} is not in the Green Channel configuration. Configuration gaps fail closed, never open.</div></div>`;
    $('#out').innerHTML=h; return; }
  h+=`<div class="sec">Flow type</div><div>${chk(1,c.vendor.qr?'QR enabled → QR flow':'QR not enabled → Non-QR flow (Phase 1)')}</div>`;
  c.lines.forEach(l=>{l.ckey=S.key;l.eligible=!!ELIG[l.sku];l.id=l.id||(S.key+'-'+l.sku);});
  const g=c.lines.filter(l=>l.eligible).length;
  h+=`<div class="kpis">${kpi(c.lines.reduce((a,l)=>a+l.invQty,0),'Units invoiced')}${kpi(c.lines.length,'Lines')}
    ${kpi(g,'Skip inspection')}${kpi(c.lines.length-g,'Need QC')}</div>
    <div class="note">No box counts appear here or anywhere downstream — the total number of boxes is not known to the system.</div>
    <div style="text-align:right;margin-top:8px"><button class="btn pri" data-a="startQC">Start QC →</button></div>`;
  $('#out').innerHTML=h;
}
function startQC(){ S.started=true;
  const h=lines().find(l=>l.sku==='MRC-HRC-400');
  if(h&&!h.lockedBy&&h.status==='new') h.lockedBy='rohit.op';
  go('worklist'); }

/* ==========================================================================
   SCREEN 1 — WORKLIST + E42 refresh
   ========================================================================== */
function renderWork(){
  lines().forEach(l=>{if(l.status==='new')l.eligible=!!ELIG[l.sku];});
  const rank={new:0,prog:1,prob:1,nsm:1,part:1,qc:2,failed:2,full:3,short:3,removed:4};
  const rows=lines().slice().sort((a,b)=>rank[a.status]-rank[b.status]).map(l=>{
    const ch=l.change&&!l.ackChange?CH[l.change.cls]:null, lock=l.lockedBy&&l.lockedBy!==S.user, op=openProbs(l).length;
    let act;
    if(l.status==='removed') act='<span class="note">not receivable</span>';
    else if(lock) act=`<span class="pill p-grey">🔒 ${l.lockedBy}</span>`;
    else if(['qc','failed'].includes(l.status)) act='<span class="note">with Team Lead</span>';
    else if(['full','short'].includes(l.status)) act='<span class="note">closed</span>';
    else act=`<button class="btn sm pri" data-a="open" data-id="${l.id}">${l.status==='new'?(l.eligible?'Receive':'Start QC'):'Resume'}</button>`;
    const m=metrics(l);
    return `<tr class="${ch?ch.c:''}"><td><div style="display:flex;gap:8px;align-items:center">
      <div style="font-size:20px">${l.img}</div><div>
        <div style="font-weight:600">${esc(l.desc)}</div>
        <div class="note">${l.sku} · EAN ${l.ean} · ${l.invQty} units invoiced${m.scanned?` · ${m.scanned} box(es) scanned`:''}${l.postedQty?` · posted ${l.postedQty}, remaining ${remaining(l)}`:''}</div>
        ${ch?`<div class="note" style="font-weight:600">${ch.i} ${ch.l}: ${esc(l.change.field)} ${esc(l.change.from)} → ${esc(l.change.to)}
          <button class="btn sm" data-a="ack" data-id="${l.id}" style="margin-left:6px">Acknowledge</button></div>`:''}
        ${l.e42Note?`<div class="note" style="color:var(--err)">⚠ ${esc(l.e42Note)}</div>`:''}
        ${l.nsm?`<div class="note" style="color:var(--err)">⚠ No SKU Match — ${esc(l.nsm.reason)}</div>`:''}
      </div></div></td>
      <td>${l.eligible?'<span class="pill p-ok">⚡ Skips inspection</span>':'<span class="pill p-warn">🔍 Needs QC</span>'}</td>
      <td>${statPill(l.status)}${l.escalated?'<div class="note" style="color:var(--err)">escalated — every box must be inspected</div>':''}</td>
      <td>${op?`<span class="pill p-err">${op}</span>`:'<span class="note">none</span>'}</td>
      <td style="text-align:right">${act}</td></tr>`;}).join('');
  app().innerHTML=`<div class="card">
    <div class="hd"><div class="n">1</div><div><h3>Lines on this invoice</h3>
      <p>Routing comes from configuration. One line, one owner at a time (partition by line, 15-minute idle release).</p></div>
      <div class="spacer"></div><button class="btn" data-a="refresh">↻ Refresh from E42</button></div>
    ${S.refresh?refreshPanel():''}
    <table><thead><tr><th>Line</th><th>Route (Gate 2)</th><th>Status</th><th>Open problems</th><th style="text-align:right">Action</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="sec">E42 change legend — colour is never the only signal</div>
    <div>${Object.values(CH).map(m=>`<span class="pill ${m.p}" style="margin:0 6px 6px 0">${m.i} ${m.l}</span>`).join('')}</div>
    <div class="note">Refresh is manual only. Acknowledgement is per line, per user and session-scoped.</div></div>`;
}
function refreshPanel(){
  const r=S.refresh;
  if(r.none) return '<div class="msg m-ok"><b>✓</b><div>E42 checked just now. Nothing has changed on this invoice.</div></div>';
  const m=CH[r.cls], l=r.add?null:line(S.key+'-'+r.sku);
  const frozen=l&&['qc','failed','part','full','short'].includes(l.status);
  const work=l&&(live(l).length||IDENT.some(k=>l.ident[k]!==null)||l.batches.length);
  let body;
  if(r.add) body=`A new line <b>${r.to}</b> has appeared in E42. It will be added as Not started.`;
  else if(r.del) body=`<b>${r.sku}</b> has been removed in E42 and cannot be received.${work?' Recorded work is retained for audit.':''}`;
  else if(frozen) body=`<b>${r.sku}</b> — ${r.field} changed ${r.from} → ${r.to}.<br>Already with the Team Lead, so <b>nothing recorded will be cleared</b>; it will be flagged out of step with E42.`;
  else if(work) body=`<b>${r.sku}</b> — ${r.field} changed ${r.from} → ${r.to}.<br><b>Everything recorded against this line will be cleared</b> — ${live(l).length} box(es), ${l.batches.length} batch(es), identity checks and problem records. Other lines are unaffected.`;
  else body=`<b>${r.sku}</b> — ${r.field} changed ${r.from} → ${r.to}.<br>Nothing recorded yet, so nothing will be lost.`;
  return `<div class="msg m-warn" style="flex-direction:column;align-items:stretch">
    <div><b>${m.i} ${m.l} detected.</b> Nothing has been applied yet.</div>
    <div style="margin-top:6px">${body}</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri sm" data-a="applyRefresh">${frozen?'Flag and refresh':(r.del?'Apply removal':'Apply and clear this line')}</button>
      <button class="btn sm" data-a="cancelRefresh">Keep what I have</button></div></div>`;
}
function doRefresh(){ const n=E42_QUEUE.find(c=>c.key===S.key); S.refresh=n||{none:true}; render(); }
function applyRefresh(){
  const r=S.refresh; E42_QUEUE=E42_QUEUE.filter(c=>c!==r);
  if(r.add){ const nl=mkLine({sku:'MRC-BOD-150',ean:mkEan('890123400009'),invQty:48,poQty:48,pack:12,plan:[{vb:'VB-4400',mfg:-100,exp:410}]});
    nl.ckey=S.key; nl.id=S.key+'-MRC-BOD-150'; nl.eligible=!!ELIG['MRC-BOD-150'];
    nl.change={cls:'add',field:'New line',from:'—',to:'MRC-BOD-150'}; lines().push(nl);
    toast('New line MRC-BOD-150 added from E42','ok');
  } else {
    const l=line(S.key+'-'+r.sku), frozen=['qc','failed','part','full','short'].includes(l.status);
    if(r.del){ l.status='removed'; l.change={cls:'del',field:r.field,from:r.from,to:r.to}; toast(`${r.sku} removed in E42`,'err'); }
    else if(frozen){ r.apply&&r.apply(l); l.e42Note=`Out of step with E42 — ${r.field} now ${r.to}. Recorded data kept.`;
      l.change={cls:r.cls,field:r.field,from:r.from,to:r.to}; toast(`${r.sku} flagged out of step`,'err'); }
    else { r.apply&&r.apply(l); const nb=live(l).length,na=l.batches.length;
      l.boxes=[];l.batches=[];l.escalated=false;l.physMRP='';l.rekeyed=false;l.flags=[];
      IDENT.forEach(k=>l.ident[k]=null); l.status='new'; l.nsm=null; l.ackShortQty=false;
      PROBLEMS=PROBLEMS.filter(p=>p.lineId!==l.id);
      l.change={cls:r.cls,field:r.field,from:r.from,to:r.to};
      toast(`${r.sku}: ${nb} box(es) and ${na} batch(es) cleared`,'err');
      if(S.lineId===l.id) S.lineId=null; } }
  S.refresh=null; go('worklist');
}
function openLine(id){
  const l=line(id);
  if(l.status==='removed'){toast('Removed in E42 — cannot be received','err');return;}
  if(l.lockedBy&&l.lockedBy!==S.user){toast(`Open on ${l.lockedBy}'s device`,'err');return;}
  if(l.nsm){S.lineId=id;go('nsm');return;}
  l.lockedBy=S.user; if(['new','part'].includes(l.status)) l.status='prog';
  S.lineId=id; S.pendingQR=null; S.nqForm=null; go(l.eligible?'recv':'ident');
}
function release(){ const l=cur();
  if(l&&l.lockedBy===S.user&&!['qc','failed','full','short'].includes(l.status)) l.lockedBy=null;
  S.pendingQR=null;S.nqForm=null;go('worklist'); }

   SCREEN 2 — IDENTITY

  const rows=[['MRP',`Order ₹${l.masterMRP} · invoice ₹${l.invoiceMRP}`],['MFG/EXP','Read the dates printed on the pack'],
    ['SKU',l.sku],['Image','Compare with the master photo'],['Description',esc(l.desc)]].map(([k,ex])=>{
    const st=l.ident[k], cls=st==='ok'?'ok':st==='flagged'?'bad':'';
    let c;
    if(k==='MRP'&&st===null) c=`<div style="display:flex;gap:6px;align-items:center">₹<input class="mini" id="mrpIn" value="${l.physMRP}" placeholder="on pack">
      <button class="btn sm pri" data-a="mrpChk">Check</button></div>`;
    else if(st===null) c=`<button class="btn sm" data-a="attrOk" data-k="${k}">Matches</button>
      <button class="btn sm dan" data-a="attrBad" data-k="${k}">Does not match</button>`;
    else if(st==='ok') c=`<span class="pill p-ok">✓ Confirmed</span>${k==='MRP'?`<span class="note"> ₹${l.physMRP}</span>`:''}
      <button class="btn sm" data-a="attrRst" data-k="${k}">undo</button>`;
    else c=`<span class="pill p-err">⚑ Problem raised</span><button class="btn sm" data-a="attrRst" data-k="${k}">undo</button>`;
    return `<div class="attr ${cls}"><div class="nm">${k}</div><div class="ex">${ex}</div><div>${c}</div></div>`;}).join('');
  app().innerHTML=`<div class="card">
    ${hd(2,'Check this is the right product','All five properties, against what is physically in front of you.')}
    <div class="kpis">${kpi(l.ean,'EAN')}${kpi(l.poQty,'Ordered')}${kpi(l.invQty,'Invoiced')}${kpi(isQR(l)?l.pack:'—',isQR(l)?'Units per box (QR)':'Units per box (declared at batch)')}</div>
    <div class="sec">EAN scan — all supported symbologies</div>
    <div class="row"><div class="f"><label>Scan or key an EAN / UPC</label>
      <input id="eanIn" placeholder="EAN-13, EAN-8, UPC-A or UPC-E" style="min-width:240px"></div>
      <button class="btn pri" data-a="eanScan">Scan EAN</button>
      <button class="btn sm" data-a="eanFill" data-v="${l.ean}">correct</button>
      <button class="btn sm" data-a="eanFill" data-v="${E.MULTI}">multi-mapped</button>
      <button class="btn sm" data-a="eanFill" data-v="${E.ORPHAN}">unmapped</button>
      <button class="btn sm" data-a="eanFill" data-v="8901234000018">bad check digit</button></div>
    <div id="eanOut" style="margin-top:10px"></div>
    <div class="sec">Five properties</div>${rows}
    <div style="text-align:right;margin:6px 0"><button class="btn sm dan" data-a="multiProb">⚑ Report several problems at once</button></div>
    <div>${flagsHtml(l)}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
      <button class="btn pri" data-a="toSample" ${identDone(l)?'':'disabled'}>Continue to Sample QC →</button></div></div>`;
}
function flagsHtml(l){
  let h='';
  l.flags.forEach(f=>h+=`<div class="msg ${f.blk?'m-err':'m-info'}"><b>${f.blk?'!':'i'}</b><div><b>${esc(f.t)}</b><br>${esc(f.x)}</div></div>`);
  const g={}; lineProbs(l).forEach(p=>(g[p.gid]=g[p.gid]||[]).push(p));
  Object.values(g).forEach(gr=>{
    const p=gr[0], blk=gr.some(x=>codeOf(x.code).blk), open=p.status==='open';
    const sc=p.uid?`box ${p.uid}`:p.scope==='line'?'whole line':`${p.qty} units`;
    const st=open?'':`<span class="pill ${p.status==='rtv'?'p-err':'p-ok'}">${p.status==='rtv'?'returning to vendor':p.status==='e42'?'corrected in E42':'closed'+(p.closedReason?' · '+p.closedReason:'')}</span>`;
    const ac=open&&blk?`<div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn sm dan" data-a="pRTV" data-g="${p.gid}">Return to vendor</button>
      <button class="btn sm" data-a="pE42" data-g="${p.gid}">Correct in E42 and refresh</button></div>`:'';
    h+=`<div class="msg ${open&&blk?'m-err':'m-warn'}"><b>⚑</b><div><b>${gr.map(x=>x.code).join(' + ')}</b>
      <span class="note">(${sc})</span> ${st}${p.remarks?`<br>${esc(p.remarks)}`:''}${ac}</div></div>`;});
  return h;
}
function eanScan(){

    $('#eanOut').innerHTML=`<div class="msg m-err"><b>✕</b><div><b>${esc(v.why)}</b><br>A <b>format</b> failure, distinct from an unmapped code. Logged either way.</div></div>`; return; }
  const hits=EAN_MAP.filter(m=>m.ean===raw);
  if(!hits.length){ log({raw,sym:v.sym,outcome:'unmapped'});
    $('#eanOut').innerHTML=`<div class="msg m-err"><b>✕</b><div><b>Valid ${v.sym}, but no SKU mapped.</b><br>Mapping lives in <span class="mono">dc_qc_ean_sku_map</span>. Entering No SKU Match.</div></div>`;
    setNSM(l,'EAN not mapped'); setTimeout(()=>go('nsm'),700); return; }
  if(hits.length>1){ log({raw,sym:v.sym,outcome:'multi-mapped',skus:hits.map(h=>h.sku)});
    $('#eanOut').innerHTML=`<div class="msg m-warn"><b>?</b><div><b>This ${v.sym} maps to more than one SKU.</b> Nothing is auto-selected.
      <div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">${hits.map(h=>`<button class="btn sm" data-a="eanPick" data-sku="${h.sku}">${h.sku}</button>`).join('')}</div></div></div>`; return; }
  const sku=hits[0].sku;

    $('#eanOut').innerHTML=`<div class="msg m-err"><b>✕</b><div><b>This EAN belongs to ${sku}, not ${l.sku}.</b>
      <div style="margin-top:7px"><button class="btn sm dan" data-a="openProb" data-c="EAN">Raise EAN problem</button></div></div></div>`; return; }

}

function mrpChk(){

function nqSave(){
  const l=cur(), f=S.nqForm;
  const vb=$('#nqVB').value.trim(), mfg=$('#nqMFG').value, exp=$('#nqEXP').value;
  const sq=parseInt($('#nqSal').value), dmg=parseInt($('#nqDmg').value)||0, rtv=parseInt($('#nqRtv').value)||0;
  let bad=false; const set=(id,m)=>{const e=$(id);if(e)e.textContent=m||'';if(m)bad=true;};
  ['#e_vb','#e_mfg','#e_exp','#e_sal','#e_dmg','#e_rtv'].forEach(i=>set(i,''));
  if(!vb) set('#e_vb','Vendor Batch is mandatory');
  else if(vb.length>20) set('#e_vb','Maximum 20 characters');
  else if(!f.editing&&getBatch(l,vb)) set('#e_vb','Already declared on this SKU — add boxes to the existing batch');
  if(!mfg) set('#e_mfg','MFG is mandatory');
  else if(daysTo(mfg)>0) set('#e_mfg','MFG cannot be in the future');
  else if(-daysTo(mfg)>CFG.mfgFloorDays) set('#e_mfg',`Older than the sanity floor of ${CFG.mfgFloorDays} days`);
  if(!exp) set('#e_exp','EXP is mandatory');
  else if(mfg&&new Date(exp)<=new Date(mfg)) set('#e_exp','EXP must be strictly later than MFG');
  else if(daysTo(exp)<0) set('#e_exp','Already expired at receipt — this is a return, not a receipt');
  if(isNaN(sq)||sq<=0) set('#e_sal','Saleable Qty is mandatory and must be greater than zero');
  if(dmg<0) set('#e_dmg','Cannot be negative');
  if(rtv<0) set('#e_rtv','Cannot be negative');
  if(!isNaN(sq)&&sq>0&&dmg+rtv>sq) set('#e_dmg',`Damaged + Return cannot exceed the Saleable Qty of ${sq}`);
  if(bad) return;
  if(f.editing){ const b=getBatch(l,f.editing);
    const oldSq=b.saleableQty;
    b.vb=vb;b.mfg=mfg;b.exp=exp;b.saleableQty=sq;b.dmgQty=dmg;b.rtvQty=rtv;
    live(l).filter(x=>x.vb===f.editing).forEach(x=>{x.vb=vb; if(oldSq!==sq) x.qty=sq;});
    toast(`Batch ${vb} updated${oldSq!==sq?` — standard qty now ${sq} on ${batchBoxes(l,b).length} box(es)`:''}`,'ok');
  } else { addBatch(l,vb,mfg,exp,sq,{dmgQty:dmg,rtvQty:rtv});
    toast(`Batch ${vb} declared · standard saleable qty ${sq} per box`,'ok'); }
  const fr=freshnessAPI(l.sku,exp);
  if(!fr.pass) toast(`Batch ${vb} breaches freshness (${fr.reason}) — the whole batch routes to RVDC`,'err');
  S.nqForm=null; render();
}

    S.boxModal={uid:last.uid, dup:true}; toast(`${last.uid} already scanned under ${vb} — showing existing details`); render(); return; }

/* ==========================================================================
   TEAM LEAD — IBD determination, allocation, atomic post
   ========================================================================== */
function tlLines(tab){
  const o=[];
  Object.keys(SCN).forEach(k=>SCN[k].lines.forEach(l=>{
    if(tab==='pending'&&l.status==='qc')o.push(l);
    if(tab==='repush'&&l.status==='failed')o.push(l);
    if(tab==='completed'&&['part','full','short'].includes(l.status))o.push(l);}));
  return o;
}
/* IBD scenario resolution (PRD 6.13.4) */
function ibdScenario(c){
  const has=c.ibds.length>0;
  if(!c.ibdConfirm&&!has) return {n:1,fmt:'standard',label:'No confirmation, no IBD → send the data as it is'};
  if(c.ibdConfirm&&!has)  return {n:2,fmt:'blocked', label:'Confirmation, no IBD → a person adds the IBD, then check again'};
  if(c.ibdConfirm&&has)   return {n:3,fmt:'ibd',     label:'Confirmation with IBD → post per IBD'};
  return {n:4,fmt:'ibd',label:'No confirmation but IBD present → posts in IBD format (OI-31, unconfirmed)'};
}
/* box-level allocation: maximise IWDC (largest open qty first), then TGDC of the mapped warehouse */
function allocate(c, sel){
  const boxes=[]; sel.forEach(l=>live(l).forEach(b=>{
    const f=freshnessAPI(l.sku,(getBatch(l,b.vb)||{}).exp);
    if(f.pass) boxes.push({uid:b.uid,qty:sal(b)+b.dmg+b.rtv,line:l,vb:b.vb});   // freshness fails are excluded first
  }));
  const rows=[], iwdc=c.ibds.filter(i=>i.loc==='IWDC').sort((a,b)=>b.open-a.open);
  const tgdc=c.ibds.filter(i=>i.loc==='TGDC'&&i.whse===c.whse);
  let rem=boxes.slice();
  iwdc.forEach(i=>{ let cap=i.open, take=[], go=true;
    while(go){ go=false;
      const cand=rem.filter(b=>b.qty<=cap).sort((a,b)=>b.qty-a.qty)[0];
      if(cand){take.push(cand);cap-=cand.qty;rem.splice(rem.indexOf(cand),1);go=true;} }
    rows.push({ibd:i.id,loc:'IWDC',whse:i.whse,open:i.open,filled:i.open-cap,short:cap,boxes:take,rack:false}); });
  if(rem.length&&tgdc.length){ const t=tgdc[0], q=rem.reduce((a,b)=>a+b.qty,0);
    rows.push({ibd:t.id,loc:'TGDC',whse:t.whse,open:t.open,filled:q,short:Math.max(0,t.open-q),boxes:rem.slice(),rack:true}); rem=[]; }
  const excluded=boxes.length===0&&sel.length>0;
  return {rows, unallocated:rem, blocked:rem.length>0, excludedAll:excluded};
}

      <div class="open-pt" style="margin-top:6px">Open: the IDoc-vs-BAPI selection (OI-02a) and the RVDC flag field name (OI-08b). Atomic multi-line posting is native to SAP, so Manage carries no compensating logic.</div>`:''}</div>`;

function tlBody(){
  const ls=tlLines(S.tab);
  if(!ls.length) return `<div class="note">${S.tab==='pending'?'Nothing waiting. Lines appear here once an operator closes receiving.':S.tab==='repush'?'Nothing rejected.':'Nothing posted yet.'}</div>`;
  const byInv={}; ls.forEach(l=>(byInv[l.ckey]=byInv[l.ckey]||[]).push(l));
  return Object.entries(byInv).map(([k,il])=>{
    const c=SCN[k], open=S.open[k+S.tab], sc=ibdScenario(c);
    const inv=il.reduce((a,l)=>a+l.invQty,0);
    const recv=il.reduce((a,l)=>a+live(l).reduce((x,b)=>x+sal(b)+b.dmg+b.rtv,0),0);
    const selN=il.filter(l=>l.selected).length;
    const ibdBox = S.tab==='pending' ? `
      <div class="msg ${sc.fmt==='blocked'?'m-err':sc.fmt==='ibd'?'m-info':'m-ok'}" style="margin:8px 0">

        ${c.ibds.length?`<div style="margin-top:7px">${c.ibds.map(i=>`<span class="pill ${i.loc==='IWDC'?'p-info':'p-ok'}" style="margin:0 5px 5px 0">${i.id} · ${i.loc} · ${i.whse} · open ${i.open}</span>`).join('')}</div>`:''}
        </div></div>` : '';
    let out=`<div class="card" style="margin:0 0 12px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${S.tab==='pending'?`<input type="checkbox" data-a="selInv" data-k="${k}" ${selN===il.length?'checked':''}>`:''}

}

function allocPreview(c,sel,sc){
  if(sc.fmt!=='ibd') return `<div class="msg m-ok"><b>✓</b><div><b>Standard format.</b> No IBD applies, so the QC data is sent as it is with no allocation step.</div></div>`;
  const a=allocate(c,sel); S.alloc=a;
  if(c.ibds.length===1) return `<div class="msg m-info"><b>1</b><div><b>Single IBD.</b> All QC details for the selected lines go in <b>${c.ibds[0].id}</b>; no allocation step runs.</div></div>`;
  return `<div class="sec">Allocation preview — maximise IWDC first (largest open quantity), then the TGDC of ${c.whse}</div>
    <table><thead><tr><th>IBD</th><th>Location</th><th>Warehouse</th><th>Open</th><th>Boxes</th><th>Filled</th><th>Shortfall</th><th>Rack-in eligible</th></tr></thead>
    <tbody>${a.rows.map(r=>`<tr><td class="mono">${r.ibd}</td>
      <td><span class="pill ${r.loc==='IWDC'?'p-info':'p-ok'}">${r.loc}</span></td><td class="note">${r.whse}</td>
      <td>${r.open}</td><td>${r.boxes.length}</td><td>${r.filled}</td>
      <td>${r.short?`<span class="pill p-warn">${r.short} left open</span>`:'<span class="note">0</span>'}</td>
      <td>${r.rack?'<span class="pill p-ok">Yes</span>':'<span class="pill p-grey">No — cross-dock</span>'}</td></tr>`).join('')}</tbody></table>
    ${a.blocked?`<div class="msg m-err"><b>!</b><div><b>${a.unallocated.length} box(es) cannot be allocated</b> — no TGDC IBD exists for ${c.whse}. The submission is blocked rather than posting a partial allocation.</div></div>`:''}
    <div class="note">IWDC IBDs are filled first, ordered by <b>largest open quantity</b>. A box is never split, so an IBD is often left slightly short — shortfall is acceptable, over-allocation is not. Batches that failed freshness are excluded before allocation begins, so they can never reach a cross-dock lane.</div>`;
}
function ibdCheck(){
  const c=cons(), sc=ibdScenario(c);
  SAP_LOG.push({t:new Date(),kind:'IBD check → SAP (existing capability)',data:{po:c.po,ibd_confirmation:c.ibdConfirm,ibds:c.ibds,scenario:sc.n,format:sc.fmt}});
  toast(`IBD check: scenario ${sc.n} — ${sc.label}`, sc.fmt==='blocked'?'err':'ok'); render();
}
function submitGR(){
  const c=cons(), sel=tlLines('pending').filter(l=>l.selected&&l.ckey===S.key);
  if(!sel.length){toast('Select lines on this invoice first','err');return;}
  const sc=ibdScenario(c);
  if(sc.fmt==='blocked'){toast('Awaiting IBD — a person must add the IBD, then run the check again. Nothing is posted and no standard-format fallback is attempted.','err');return;}
  let alloc=null;
  if(sc.fmt==='ibd'&&c.ibds.length>1){ alloc=allocate(c,sel);
    if(alloc.blocked){toast(`${alloc.unallocated.length} box(es) unallocated — no TGDC IBD for ${c.whse}. Submission blocked.`,'err');return;} }
  const sub={id:'SUB-'+(++subSeq),at:new Date(),lines:sel.map(l=>l.id),state:'submitted',attempt:1,key:S.key,fmt:sc.fmt};
  SUBS.push(sub);
  const payload={submission:sub.id, format:sc.fmt, po:c.po, lines:sel.map(l=>({
    line:l.id, sku:l.sku, invoiced:l.invQty,
    batches:l.batches.map(b=>{const f=freshnessAPI(l.sku,b.exp);
      return {sku:l.sku, vendor_batch:b.vb, mfg:b.mfg, exp:b.exp, qty:batchQty(l,b),
        disposition:f.pass?'TGDC':'RVDC',
        rvdc_freshness_flag:f.pass?undefined:'<line-item level; field name pending OI-08b>'};})}))};
  if(alloc) payload.ibd_allocation=alloc.rows.map(r=>({ibd:r.ibd,location:r.loc,warehouse:r.whse,
    boxes:r.boxes.map(b=>b.uid),filled:r.filled,shortfall:r.short,rack_in_eligible:r.rack}));
  else if(sc.fmt==='ibd') payload.ibd=c.ibds[0].id;
  SAP_LOG.push({t:new Date(),kind:`GR payload → SAP (${sc.fmt.toUpperCase()} format)`,data:payload});
  const rej=sel.find(l=>l.forceErr);
  if(rej){ sub.state='rejected'; sel.forEach(l=>l.status='failed');
    SAP_LOG.push({t:new Date(),kind:'SAP response ← rejected',data:{submission:sub.id,
      error:`SKU–SLOC–Plant extension missing for ${rej.sku}`,note:'Atomic and native in SAP: no line posted'}});
    toast(`Submission rejected — ${rej.sku}. Nothing posted; moved to Repush.`,'err'); S.tab='repush'; render(); return; }
  postSub(sub,sel,alloc,c); toast(`Submission ${sub.id} posted in ${sc.fmt.toUpperCase()} format`,'ok');
  S.tab='completed'; render();
}
function postSub(sub,sel,alloc,c){
  const resp={submission:sub.id,batch_ids:[],grns:[],rack_in:[]};
  sel.forEach(l=>{
    l.batches.forEach(b=>{
      const key=l.sku+'|'+b.vb;
      if(!SAP_BATCH_REG[key]) SAP_BATCH_REG[key]='B'+(++sapSeq)+'-'+b.mfg.slice(2,7).replace('-','');
      if(b.vb==='VB-3311'&&!b.sapBatchId&&!b.tried){ b.tried=true;b.unresolved=true;
        resp.batch_ids.push({sku:l.sku,vendor_batch:b.vb,batch_id:null,note:'not returned'});
        setTimeout(()=>{ b.sapBatchId=SAP_BATCH_REG[key]; b.unresolved=false;
          SAP_LOG.push({t:new Date(),kind:'Batch ID reconciliation job',data:{sku:l.sku,vendor_batch:b.vb,batch_id:b.sapBatchId,note:'cleared automatically, no user action'}});
          toast(`Reconciliation job resolved Batch ID for ${b.vb} → ${b.sapBatchId}`,'ok'); if(S.role==='tl') render(); },3500);
        return; }
      b.sapBatchId=SAP_BATCH_REG[key]; b.unresolved=false;
      resp.batch_ids.push({sku:l.sku,vendor_batch:b.vb,batch_id:b.sapBatchId}); });
    const m=metrics(l), posted=m.qty+m.dmg+m.rtv, grn='49'+Math.floor(1000000+Math.random()*8999999);
    l.grns.push(grn); l.postedQty=Math.min(l.invQty,l.postedQty+posted);
    resp.grns.push({line:l.id,grn,qty:posted});
    // rack-in eligibility per box
    live(l).forEach(b=>{
      const f=freshnessAPI(l.sku,(getBatch(l,b.vb)||{}).exp);
      let elig=false, why='';
      if(!f.pass){ why='freshness failure → RVDC'; }
      else if(alloc){ const r=alloc.rows.find(x=>x.boxes.find(y=>y.uid===b.uid));
        if(r){ elig=r.rack; why=r.rack?`TGDC of ${r.whse}`:`${r.loc} ${r.ibd} — cross-dock`; } else why='not allocated'; }
      else { elig=true; why=`TGDC of ${c.whse}`; }
      resp.rack_in.push({box:b.uid,rack_in_eligible:elig,reason:why}); });
    l.status=remaining(l)>0?'part':'full'; l.boxes=[]; l.ackShortQty=false;
    l.batches=l.batches.filter(b=>b.sapBatchId||b.unresolved); });
  sub.state='posted'; sub.resp=resp;
  SAP_LOG.push({t:new Date(),kind:'SAP response ← posted',data:resp});
}

    case 'pCode': { pStash();const i=S.draft.codes.indexOf(c);i>=0?S.draft.codes.splice(i,1):S.draft.codes.push(c);render(); break; }
    case 'pScope': pStash();S.draft.scope=t.dataset.s;render(); break;
    case 'pImg': pStash();S.draft.imgs=S.draft.imgs>=3?0:S.draft.imgs+1;render(); break;
    case 'pCancel': go(S.back||'worklist'); break;
    case 'pSave': pSave(); break;
    case 'pRTV': resolveGroup(t.dataset.g,'rtv'); break;
    case 'pE42': resolveGroup(t.dataset.g,'e42'); break;
    case 'nsmReason': l.nsm.reason=$('#nsmR').value;toast('Reason updated','ok');render(); break;
    case 'nsmRetry': { const ok=t.dataset.ok==='1';
      l.nsm.tries.push(`${new Date().toLocaleTimeString()} — retry ${ok?'resolved':'failed'} (${S.user})`);
      if(ok){PROBLEMS.filter(p=>p.lineId===l.id&&p.code==='SKU'&&p.status==='open').forEach(p=>{p.status='closed';p.closedReason='resolved on retry';});
        l.nsm=null;l.status='prog';l.ident.SKU='ok';toast('SKU identified — line unblocked','ok');go('ident');}
      else {toast('Retry failed — logged, line stays blocked','err');render();} break; }
    case 'nsmEsc': l.nsm.tries.push(`${new Date().toLocaleTimeString()} — escalated to Team Lead`);
      toast('Escalated — visible to the Team Lead','err');render(); break;
    case 'nsmRTV': { const g=PROBLEMS.find(p=>p.lineId===l.id&&p.code==='SKU'&&p.status==='open');
      if(g)resolveGroup(g.gid,'rtv'); l.nsm=null;l.status='prob';toast('Marked for return to vendor','ok');go('worklist'); break; }
    case 'nsmMD': l.nsm.tries.push(`${new Date().toLocaleTimeString()} — master-data request raised off-system`);
      toast('Manual off-system step — no tracked request is created');render(); break;
    case 'tab': S.tab=t.dataset.t;render(); break;
    case 'exp': S.open[k+S.tab]=!S.open[k+S.tab];render(); break;
    case 'selInv': tlLines(S.tab).filter(x=>x.ckey===k).forEach(x=>x.selected=t.checked);render(); break;
    case 'selLine': line(id).selected=t.checked;render(); break;
    case 'forceErr': line(id).forceErr=t.checked; break;
    case 'ibdCheck': ibdCheck(); break;
    case 'addIbd': { const c=SCN[k]; ibdSeq++;
      c.ibds=[{id:'IBD-'+(2000+ibdSeq),loc:'IWDC',open:40,whse:'CROSS-DOCK-A'},
              {id:'IBD-'+(2001+ibdSeq),loc:'TGDC',open:150,whse:c.whse}];
      toast('IBD added manually. Run the check again to pick up the details.','ok'); render(); break; }
    case 'reCheck': { S.key=k; ibdCheck(); break; }
    case 'submit': submitGR(); break;
    case 'repushOne': { const ln=line(id); ln.forceErr=false;
      const sub=SUBS.filter(x=>x.state==='rejected').find(x=>x.lines.includes(ln.id));
      if(!sub){toast('No rejected submission for that line');break;}
      const set=sub.lines.map(x=>line(x)).filter(x=>x&&!x.forceErr);
      sub.attempt++; postSub(sub,set,null,SCN[sub.key]);
      toast(`${sub.id} reposted on attempt ${sub.attempt}`,'ok');S.tab='completed';render(); break; }
    case 'repushAll': { SUBS.filter(x=>x.state==='rejected').forEach(sub=>{
        const set=sub.lines.map(x=>line(x)).filter(Boolean); set.forEach(x=>x.forceErr=false);
        sub.attempt++; postSub(sub,set,null,SCN[sub.key]); });
      toast('All rejected submissions reposted','ok');S.tab='completed';render(); break; }
    case 'shortClose': { const ln=line(id); ln.shortClosed=`balance of ${remaining(ln)} units will not arrive`;
      ln.status='short'; toast(`${ln.sku} short-closed with a reason`,'ok');render(); break; }
  }
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-a="pStatus"]'); if(!t||!t.value)return;
  const p=PROBLEMS.find(x=>x.id===t.dataset.id);
  p.hist.push({from:p.status,to:t.value,by:S.user,at:new Date()}); p.status=t.value;
  toast(`${p.code} status changed to ${t.value} — logged with previous value`,'ok'); render();
});
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.fld)return;
  const b=findBox(el.dataset.uid), l=findBoxLine(el.dataset.uid); if(!b||!l)return;
  const v=Math.max(0,parseInt(el.value)||0); b[el.dataset.fld]=v;
  if(b.dmg+b.rtv>b.qty){toast(`Damaged + Return cannot exceed the standard quantity of ${b.qty}`,'err');b[el.dataset.fld]=0;render();return;}
  if(S.screen==='sample'){const r=defectRate(l);
    if(!l.escalated&&r>CFG.escPct){l.escalated=true;
      toast(`Problem rate ${r}% of inspected boxes exceeds ${CFG.escPct}% — every box scanned must now be inspected`,'err');}}
  render();
});
render();
</script>
</body>
</html>
