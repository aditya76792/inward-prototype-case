<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Module — Phase 1 Prototype (PRD v2.4)</title>
<style>
:root{
  --brand:#662d91; --brand-d:#4a148c; --brand-t:#f4e9fa; --accent:#e91e63;
  --bg:#f5f4f8; --card:#fff; --ink:#211c2e; --muted:#6d6680; --line:#e6e1ee;
  --ok:#177245; --ok-bg:#e6f4ea; --warn:#8a6100; --warn-bg:#fdf3d7;
  --err:#a32020; --err-bg:#fbe6e6; --info:#1a4d8f; --info-bg:#e8eefb;
  --grey:#5f5f5f; --grey-bg:#eeeeee;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:96px}
h1,h2,h3,h4{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* nav */
.nav{background:var(--brand);border-bottom:3px solid var(--accent);padding:8px 16px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.nav .brand{color:#fff;font-weight:700;font-size:15px}
.nav .sub{color:#e2d3f0;font-size:11px}
.roles{display:flex;gap:0;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden}
.roles button{background:transparent;color:#fff;border:0;padding:6px 12px;font-size:12px}
.roles button.on{background:#fff;color:var(--brand);font-weight:600}
.navbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:8px;padding:6px 10px;font-size:12px}
.navbtn:hover{background:rgba(255,255,255,.28)}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hd .n{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.hd h3{font-size:16px}
.hd p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.spacer{flex:1}

/* rail */
.rail{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rail div{flex:1 1 0;min-width:104px;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}
.rail div b{width:19px;height:19px;border-radius:5px;background:#eae6f0;color:#7b7290;display:flex;
  align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
.rail div.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rail div.on b{background:#fff;color:var(--brand)}
.rail div.done{background:var(--ok-bg);border-color:#cfe6d6;color:var(--ok)}
.rail div.done b{background:var(--ok);color:#fff}
.rail div.skip{opacity:.4}

/* table */
table{width:100%;border-collapse:collapse}
th{background:var(--brand-t);color:var(--brand-d);font-size:11px;text-align:left;padding:9px;font-weight:600}
td{padding:9px;border-bottom:1px solid #f2eff7;font-size:13px;vertical-align:middle}
tr.inv td{background:#faf8fc;font-weight:600}
tr.sku td{background:#fff}

/* bits */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.p-grey{background:var(--grey-bg);color:var(--grey)} .p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-err{background:var(--err-bg);color:var(--err)}
.p-info{background:var(--info-bg);color:var(--info)} .p-brand{background:var(--brand-t);color:var(--brand-d)}
.msg{display:flex;gap:8px;padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:8px;align-items:flex-start}
.m-ok{background:var(--ok-bg);color:var(--ok)} .m-err{background:var(--err-bg);color:var(--err)}
.m-warn{background:var(--warn-bg);color:var(--warn)} .m-info{background:var(--info-bg);color:var(--info)}
.open-pt{font-size:11.5px;background:#fffbea;border:1px dashed #d8b100;color:#6b5200;border-radius:8px;padding:7px 10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px}
.btn:hover{background:#f7f5fa}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-d)}
.btn.dan{background:#fff;color:var(--err);border-color:#e8c4c4}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:600;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:120px;background:#fff}
.f input.bad{border-color:var(--err);background:#fffafa}
.f .err{font-size:11px;color:var(--err)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:#fff}
.kpi b{display:block;font-size:19px;color:var(--brand-d)}
.kpi span{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.box{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.box.insp{background:#faf6fd;border-color:#e2d4f0}
.box.dmg{background:#fdf5f5;border-color:#f0cfcf}
.mini{width:64px}
.attr{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;display:flex;
  gap:10px;align-items:center;flex-wrap:wrap}
.attr .nm{font-weight:600;min-width:120px;font-size:13px}
.attr .ex{flex:1 1 180px;font-size:12px;color:var(--muted)}
.attr.ok{background:#f5faf6;border-color:#d4e8da} .attr.bad{background:#fdf5f5;border-color:#f0cfcf}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.tabs .ct{background:#eee;color:#666;border-radius:20px;padding:0 6px;font-size:11px;font-weight:700;margin-left:6px}
.tabs button.on .ct{background:#fff;color:var(--brand)}
.chev{cursor:pointer;color:var(--brand);font-weight:700;user-select:none}
.disp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.d{border-radius:9px;padding:10px;color:#fff;text-align:center}
.d b{display:block;font-size:18px}.d span{font-size:10.5px;opacity:.92}
.d1{background:#177245}.d2{background:#1565c0}.d3{background:#c96a00}.d4{background:#b3261e}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.chip{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:#fff;display:flex;gap:8px}
.chip.on{border-color:var(--brand);background:#faf6fd}
.chip b{font-size:12.5px}.chip .h{font-size:11.5px;color:var(--muted)}
/* E42 change colour classes — colour + label + icon, never colour alone */
.ch-crit{background:var(--err-bg);border-left:4px solid var(--err)}
.ch-mat{background:var(--warn-bg);border-left:4px solid var(--warn)}
.ch-info{background:var(--info-bg);border-left:4px solid var(--info)}
.ch-add{background:var(--ok-bg);border-left:4px solid var(--ok)}
.ch-del{background:var(--grey-bg);border-left:4px solid var(--grey);text-decoration:line-through;opacity:.75}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 16px;display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;z-index:40}
.toasts{position:fixed;top:60px;right:14px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;
  padding:9px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:#fff;border-left:1px solid var(--line);
  box-shadow:-8px 0 26px rgba(0,0,0,.12);z-index:80;padding:16px;overflow:auto}
.drawer.hide{display:none}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:70}
.ovl.hide{display:none}
.hide{display:none!important}
.sec{font-size:11.5px;font-weight:700;color:var(--muted);margin:14px 0 7px}
pre{background:#f7f5fa;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;margin:0}
</style>
</head>
<body>

<div class="nav">
  <div>
    <div class="brand">QC Module — Inbound GR &amp; Quality Control</div>
    <div class="sub" id="ctx">Phase 1 prototype · PRD v2.4</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="roles" id="roles">
      <button data-a="role" data-r="op" class="on">QC Operator</button>
      <button data-a="role" data-r="tl">Team Lead</button>
    </div>
    <button class="navbtn" data-a="toIntake">Consignments</button>
      <button class="navbtn" data-a="openReg">Problems</button>
    <button class="navbtn" data-a="openSap">SAP log</button>
    <button class="navbtn" data-a="openCfg">Config</button>
  </div>
</div>

<div class="wrap">
  <div id="rail"></div>
  <div id="app"></div>
</div>

<div class="foot" id="foot"></div>
<div class="toasts" id="toasts"></div>
<div class="ovl hide" id="ovl" data-a="closeDrawer"></div>
<div class="drawer hide" id="drawer"></div>

<script>
/* ==========================================================================
   QC Module — Phase 1 working prototype, built to PRD v2.4
   Single file, in-memory. Simulates E42, the Receipt Panel and SAP.
   ========================================================================== */

/* ---------- configuration (PRD 6.14, dc_qc_config_green_channel) ---------- */
const CFG = {
  samplePct: 10,      // % of SKU invoiced quantity
  sampleCap: 5,       // BOXES — applied after unit->box conversion (6.6.1)
  escPct: 20,         // % of inspected boxes with a problem -> 100% inspection
  windowDays: 15,     // batch date-consistency window (6.6.2)
  lockMins: 15        // line lock idle timeout (OI-23)
};
const CFG_AUDIT = [];

/* ---------- dates ---------- */
const TODAY = new Date();
const dOff = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const daysTo = iso => Math.round((new Date(iso) - TODAY) / 86400000);
const gap = (a,b) => Math.abs(Math.round((new Date(a) - new Date(b)) / 86400000));
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '—';

/* ---------- EAN / UPC check digit (PRD 6.4.2 — all symbologies) ---------- */
function genCheck(data){ let s=0,w=3; for(let i=data.length-1;i>=0;i--){ s += (+data[i])*w; w = w===3?1:3; } return (10-(s%10))%10; }
function upceBody(e){
  const N=e[0], d=e.slice(1,7), l=d[5];
  if('012'.includes(l)) return N+d[0]+d[1]+l+'0000'+d[2]+d[3]+d[4];
  if(l==='3') return N+d[0]+d[1]+d[2]+'00000'+d[3]+d[4];
  if(l==='4') return N+d[0]+d[1]+d[2]+d[3]+'00000'+d[4];
  return N+d[0]+d[1]+d[2]+d[3]+d[4]+'0000'+l;
}
function validateEan(raw){
  const c = String(raw||'').trim();
  if(!c) return {ok:false, why:'Enter or scan an EAN'};
  if(!/^\d+$/.test(c)) return {ok:false, why:'Not a valid EAN — non-numeric characters'};
  if(c.length===13) return genCheck(c.slice(0,12))===+c[12] ? {ok:true,sym:'EAN-13'} : {ok:false,sym:'EAN-13',why:'Not a valid EAN — check digit failed (EAN-13)'};
  if(c.length===12) return genCheck(c.slice(0,11))===+c[11] ? {ok:true,sym:'UPC-A'} : {ok:false,sym:'UPC-A',why:'Not a valid EAN — check digit failed (UPC-A)'};
  if(c.length===8){
    if(genCheck(c.slice(0,7))===+c[7]) return {ok:true,sym:'EAN-8'};
    if(genCheck(upceBody(c))===+c[7]) return {ok:true,sym:'UPC-E'};
    return {ok:false,sym:'EAN-8/UPC-E',why:'Not a valid EAN — check digit failed (EAN-8 / UPC-E)'};
  }
  return {ok:false, why:`Not a valid EAN — length ${c.length} matches no supported symbology`};
}
const mkEan = base12 => base12 + genCheck(base12);

/* ---------- seed masters ---------- */
const E = {
  PCO: mkEan('890123400001'), LVN: mkEan('890123400002'), SWG: mkEan('890123400003'),
  NIH: mkEan('890123400004'), HRC: mkEan('890123400005'), SHM: mkEan('700111000001'),
  OIL: mkEan('700111000002'), MULTI: mkEan('890123450001'), UPCA: mkEan('03600029145'),
  ORPHAN: mkEan('890123499999')
};
/* dc_qc_ean_sku_map — internal, one EAN may map to several SKUs (EAN-05) */
const EAN_MAP = [
  {ean:E.PCO, sku:'MRC-PCO-200'}, {ean:E.LVN, sku:'MRC-LVN-100'}, {ean:E.SWG, sku:'MRC-SWG-250'},
  {ean:E.NIH, sku:'MRC-NIH-100'}, {ean:E.HRC, sku:'MRC-HRC-400'}, {ean:E.SHM, sku:'SUN-SHM-200'},
  {ean:E.OIL, sku:'SUN-OIL-500'}, {ean:E.UPCA, sku:'MRC-LVN-100'},
  {ean:E.MULTI, sku:'MRC-NIH-100'}, {ean:E.MULTI, sku:'MRC-NIH-200'}
];
const SKU_MASTER = {
  'MRC-PCO-200':{desc:'Parachute Coconut Oil 200ml', mrp:99,  img:'🥥', gram:'200ml'},
  'MRC-LVN-100':{desc:'Livon Silk Serum 100ml',      mrp:245, img:'✨', gram:'100ml'},
  'MRC-SWG-250':{desc:'Set Wet Hair Gel 250ml',      mrp:180, img:'🧴', gram:'250ml'},
  'MRC-NIH-100':{desc:'Nihar Naturals Oil 100ml',    mrp:55,  img:'🌿', gram:'100ml'},
  'MRC-NIH-200':{desc:'Nihar Naturals Oil 200ml',    mrp:95,  img:'🌿', gram:'200ml'},
  'MRC-HRC-400':{desc:'Hair & Care Oil 400ml',       mrp:210, img:'🧴', gram:'400ml'},
  'SUN-SHM-200':{desc:'Herbal Shampoo 200ml',        mrp:145, img:'🧼', gram:'200ml'},
  'SUN-OIL-500':{desc:'Herbal Hair Oil 500ml',       mrp:260, img:'🫗', gram:'500ml'},
  'MRC-BOD-150':{desc:'Body Lotion 150ml',           mrp:175, img:'🧴', gram:'150ml'}
};
/* freshness criteria — existing API works on module month|days (OI-20) */
const FRESHNESS = {
  'MRC-PCO-200':{module:'month', value:3},
  'MRC-LVN-100':{module:'days',  value:90},
  'MRC-SWG-250':{module:'month', value:2},
  'SUN-SHM-200':{module:'days',  value:60},
  'SUN-OIL-500':{module:'month', value:2}
  /* MRC-NIH-100 deliberately absent -> default pass (BR-29) */
};
/* Green Channel eligibility — dc_qc_config_green_channel (Gate 2) */
const ELIG = {'MRC-PCO-200':true,'MRC-LVN-100':false,'MRC-SWG-250':false,'MRC-NIH-100':false,
              'MRC-HRC-400':false,'SUN-SHM-200':false,'SUN-OIL-500':false,'MRC-BOD-150':false};

/* ---------- simulated externals ---------- */
const RECEIPT_PANEL = new Set();     // UIDs flagged damaged at unloading (box level, status only)
const SAP_BATCH_REG = {};            // 'SKU|VENDORBATCH' -> batch_id  (SAP owns this)
const SAP_LOG = [];                  // payload / response log for the demo
let sapBatchSeq = 700;
let uidSeq = 88400, evtSeq = 0, subSeq = 0;

/* ---------- seed lines / consignments ---------- */
function mkLine(o){
  const m = SKU_MASTER[o.sku];
  const L = Object.assign({
    desc:m.desc, img:m.img, gram:m.gram, masterMRP:m.mrp, invoiceMRP:m.mrp,
    eligible:false, status:'new', lockedBy:null, physMRP:'', rekeyed:false,
    ident:{MRP:null,'MFG/EXP':null,SKU:null,Image:null,Description:null},
    flags:[], batches:[], boxes:[], escalated:false, nsm:null, e42Note:null,
    postedQty:0, shortClosed:null, grns:[], selected:true, forceErr:false, ackChange:false, change:null
  }, o);
  L.expBoxes = Math.ceil(L.invQty / L.pack);
  L.uidPool = Array.from({length:L.expBoxes+2}, () => 'UID-' + (++uidSeq));
  return L;
}
function seed(){
  const S = {
    A:{po:'4500098231', inv:'INV-A-88123', plant:'DC-Bhiwandi', dock:'Dock 3',
       vendor:{name:'Marico Ltd', configured:true, qr:true}, lines:[
      mkLine({sku:'MRC-PCO-200', ean:E.PCO, invQty:60,  poQty:60,  pack:10,
              plan:[{vb:'VB-7781', mfg:-120, exp:400}]}),
      mkLine({sku:'MRC-LVN-100', ean:E.LVN, invQty:120, poQty:120, pack:4,
              /* two vendor batches; VB-3311 breaches 90-day freshness; one box date-divergent */
              plan:[{vb:'VB-3310', mfg:-300, exp:430},{vb:'VB-3311', mfg:-380, exp:61},
                    {vb:'VB-3310', mfg:-250, exp:380}]}),
      mkLine({sku:'MRC-SWG-250', ean:E.SWG, invQty:120, poQty:110, pack:12, invoiceMRP:175,
              plan:[{vb:'VB-5502', mfg:-150, exp:380}]}),
      mkLine({sku:'MRC-NIH-100', ean:E.NIH, invQty:2000, poQty:2000, pack:20,
              plan:[{vb:'VB-9004', mfg:-90, exp:420}]}),
      mkLine({sku:'MRC-HRC-400', ean:E.HRC, invQty:80, poQty:80, pack:8,
              plan:[{vb:'VB-6620', mfg:-200, exp:360}]})
    ]},
    B:{po:'4500077310', inv:'INV-B-4471', plant:'DC-Bhiwandi', dock:'Dock 3',
       vendor:{name:'Sunrise Traders', configured:true, qr:false}, lines:[
      mkLine({sku:'SUN-SHM-200', ean:E.SHM, invQty:96,  poQty:96,  pack:8,  plan:[]}),
      mkLine({sku:'SUN-OIL-500', ean:E.OIL, invQty:120, poQty:120, pack:12, plan:[]})
    ]},
    C:{po:'4500000111', inv:'INV-C-0001', plant:'DC-Bhiwandi', dock:'Dock 3',
       vendor:{name:'Unregistered Vendor', configured:false, qr:false}, lines:[]}
  };
  // flag some UIDs damaged at unloading (Receipt Panel — box level, status only)
  RECEIPT_PANEL.add(S.A.lines[1].uidPool[1]);
  RECEIPT_PANEL.add(S.A.lines[0].uidPool[2]);
  RECEIPT_PANEL.add(S.B.lines[0].uidPool[0]);
  return S;
}
let SCN = seed();

/* E42 change queue — revealed one refresh at a time (PRD 6.3) */
let E42_QUEUE = [
  {key:'A', sku:'MRC-SWG-250', cls:'mat',  field:'Invoice quantity', from:120, to:96, apply:l=>{l.invQty=96;l.expBoxes=Math.ceil(96/l.pack);}},
  {key:'A', sku:'MRC-LVN-100', cls:'mat',  field:'Invoice MRP', from:245, to:249, apply:l=>{l.invoiceMRP=249;}},
  {key:'A', sku:null, cls:'add', field:'New line', from:'—', to:'MRC-BOD-150', add:true},
  {key:'A', sku:'MRC-NIH-100', cls:'crit', field:'SKU / material code', from:'MRC-NIH-100', to:'MRC-NIH-200', apply:l=>{l.sku='MRC-NIH-200';const m=SKU_MASTER['MRC-NIH-200'];l.desc=m.desc;l.masterMRP=m.mrp;l.invoiceMRP=m.mrp;}},
  {key:'A', sku:'MRC-PCO-200', cls:'del',  field:'Line removed in E42', from:'present', to:'removed', del:true}
];
const CH_META = {
  crit:{cls:'ch-crit', label:'Critical change', icon:'!', pill:'p-err'},
  mat: {cls:'ch-mat',  label:'Material change', icon:'~', pill:'p-warn'},
  info:{cls:'ch-info', label:'Informational',   icon:'i', pill:'p-info'},
  add: {cls:'ch-add',  label:'New line',        icon:'+', pill:'p-ok'},
  del: {cls:'ch-del',  label:'Removed in E42',  icon:'x', pill:'p-grey'}
};

/* ---------- problems (PRD 6.12) ---------- */
const CODES = [
  {c:'EAN',        blk:true,  h:'EAN does not match the line, or is wrong/unreadable on the pack'},
  {c:'SKU',        blk:true,  h:'Physical product is not the ordered SKU'},
  {c:'MFG/EXP',    blk:false, h:'Dates wrong, illegible, or contradicting the QR'},
  {c:'Image',      blk:true,  h:'Product does not match the master image'},
  {c:'Description',blk:true,  h:'Pack text contradicts the master description'},
  {c:'MRP',        blk:true,  h:'MRP on pack does not match the order or invoice'},
  {c:'Damage',     blk:false, h:'Physical damage to product or shipper. Photo required.', img:true}
];
const codeOf = c => CODES.find(x=>x.c===c);
const IDENT_KEYS = ['MRP','MFG/EXP','SKU','Image','Description'];
let PROBLEMS = [];   // dc_qc_problem_event + code + status_history
let SUBS = [];       // dc_qc_gr_submission

/* ---------- state ---------- */
let S = {role:'op', screen:'intake', key:'A', lineId:null, started:false,
         tab:'pending', open:{}, refresh:null, draft:null, back:null, regFilter:'',
         pendingQR:null, nqForm:null, editBatch:null, user:'aditya.op'};

/* ---------- derived ---------- */
const cons = () => SCN[S.key];
const lines = () => cons().lines;
const line = id => { for(const k in SCN){ const f=SCN[k].lines.find(l=>l.id===id); if(f) return f; } return null; };
const cur = () => line(S.lineId);
const isQR = l => SCN[l.ckey].vendor.qr;
const remaining = l => Math.max(0, l.invQty - l.postedQty);
const sal = b => Math.max(0, b.qty - b.short + b.excess - b.dmg - b.rtv);
const lineProbs = l => PROBLEMS.filter(p=>p.lineId===l.id);
const openProbs = l => lineProbs(l).filter(p=>p.status==='open');
const identDone = l => IDENT_KEYS.every(k=>l.ident[k]==='ok');

/* sampling — PRD 6.6.1: qc_qty -> boxes -> cap */
function sampling(l){
  const qcQty = l.invQty * CFG.samplePct/100;
  const boxesFor = Math.max(1, Math.ceil(qcQty / l.pack));
  const target = l.escalated ? l.expBoxes : Math.min(boxesFor, CFG.sampleCap);
  return {qcQty, boxesFor, target, cap:CFG.sampleCap, capBinds: boxesFor > CFG.sampleCap};
}
const inspected = l => l.boxes.filter(b=>b.insp);
const defectRate = l => { const i=inspected(l); return i.length ? Math.round(100*i.filter(b=>b.short||b.excess||b.dmg||b.rtv||b.probs.length).length/i.length) : 0; };

/* freshness — calls the "existing built API" (module month|days) */
function freshnessAPI(sku, exp){
  const c = FRESHNESS[sku];
  if(!c) return {pass:true, reason:'no criteria maintained — default pass', criteria:'—'};
  const need = c.module==='month' ? c.value*30 : c.value;
  const left = daysTo(exp);
  return {pass: left >= need, left, need, criteria:`${c.value} ${c.module}`,
          reason: left>=need ? `${left}d left vs ${need}d required` : `only ${left}d left, ${need}d required`};
}
/* batch key = SKU + Vendor Batch (PRD 6.16) */
const bkey = (sku,vb) => sku+'|'+vb;
function getBatch(l, vb){ return l.batches.find(b=>b.vb===vb); }
function addBatch(l, vb, mfg, exp, extra){
  let b = getBatch(l, vb);
  if(b) return b;
  b = Object.assign({vb, mfg, exp, sapBatchId:null, dmgQty:0, rtvQty:0, unresolved:false}, extra||{});
  l.batches.push(b); return b;
}
function batchQty(l,b){ return l.boxes.filter(x=>x.vb===b.vb).reduce((a,x)=>a+sal(x)+x.dmg+x.rtv,0); }
function batchBoxes(l,b){ return l.boxes.filter(x=>x.vb===b.vb); }

/* ---------- ui helpers ---------- */
const $ = s => document.querySelector(s);
const all = s => [...document.querySelectorAll(s)];
const app = () => $('#app');
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m, k){ const t=document.createElement('div'); t.className='toast '+(k||''); t.textContent=m;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 4200); }
const STAT = {
  new:['Not started','p-grey'], prog:['In progress','p-warn'], nsm:['No SKU Match','p-err'],
  prob:['Problem raised','p-err'], qc:['QC complete, awaiting GR','p-ok'],
  failed:['In a failed submission','p-err'], part:['Partially posted','p-info'],
  full:['Fully posted','p-grey'], short:['Short-closed','p-grey'], removed:['Removed in E42','p-grey']
};
const statPill = s => `<span class="pill ${STAT[s][1]}">${STAT[s][0]}</span>`;
const hd = (n,t,p) => `<div class="hd">${n!==null?`<div class="n">${n}</div>`:''}<div><h3>${t}</h3><p>${p}</p></div></div>`;
const kpi = (v,l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;

/* ==========================================================================
   ROUTER
   ========================================================================== */
function go(scr){ if(scr) S.screen=scr; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){
  all('#roles button').forEach(b=>b.classList.toggle('on', b.dataset.r===S.role));
  $('#ctx').textContent = (S.role==='op' && S.screen==='intake')
    ? 'Phase 1 prototype · PRD v2.4'
    : `PO ${cons().po} · ${cons().vendor.name} · ${cons().dock} · ${cons().vendor.qr?'QR flow':'Non-QR flow'}`;
  renderRail(); renderScreen(); renderFoot();
}
function renderRail(){
  const r=$('#rail');
  if(S.role!=='op' || ['reg'].includes(S.screen)){ r.innerHTML=''; return; }
  const steps=[['intake','Intake',0],['worklist','Worklist',1],['ident','Identity',2],['sample','Sample QC',3],['recv','Receiving',4]];
  const order=steps.map(s=>s[0]);
  const l = S.lineId?cur():null, skip = l&&l.eligible;
  const at = order.indexOf(['prob','nsm'].includes(S.screen) ? (S.back||'worklist') : S.screen);
  r.innerHTML = '<div class="rail">'+steps.map(s=>{
    const i=order.indexOf(s[0]); let c = i===at?'on': i<at?'done':'';
    if(skip && ['ident','sample'].includes(s[0])) c+=' skip';
    return `<div class="${c}"><b>${s[2]}</b><span>${s[1]}</span></div>`;
  }).join('')+'</div>';
}
function renderScreen(){
  if(S.screen==='reg') return renderRegister();
  if(S.role==='tl') return renderTL();
  ({intake:renderIntake, worklist:renderWorklist, ident:renderIdent, sample:renderSample,
    recv:renderRecv, prob:renderProblem, nsm:renderNSM}[S.screen]||renderIntake)();
}
function renderFoot(){
  const f=$('#foot'); f.innerHTML='';
  if(S.screen==='reg'){ f.innerHTML=`<button class="btn" data-a="closeReg">Back</button>`; return; }
  if(S.role==='tl'){
    if(S.tab==='pending'){
      const n = tlLines('pending').filter(l=>l.selected).length;
      f.innerHTML = `<span class="note">${n} line(s) selected · submission is all-or-nothing</span>
        <button class="btn pri" data-a="submit" ${n?'':'disabled'}>Post goods receipt</button>`;
    } else if(S.tab==='repush'){
      const n = SUBS.filter(x=>x.state==='rejected').length;
      f.innerHTML = `<span class="note">${n} rejected submission(s)</span>
        <button class="btn pri" data-a="repushAll" ${n?'':'disabled'}>Repush all</button>`;
    } else f.innerHTML = `<span class="note">${SUBS.filter(x=>x.state==='posted').length} posted submission(s)</span>`;
    return;
  }
  if(S.screen==='worklist'){
    const d = lines().filter(l=>['qc','failed','part','full','short'].includes(l.status)).length;
    f.innerHTML = `<span class="note">${d} of ${lines().length} lines with the Team Lead</span>
      <button class="btn" data-a="role" data-r="tl">Open Team Lead panel →</button>`;
  } else if(['ident','sample','recv'].includes(S.screen)){
    f.innerHTML = `<button class="btn" data-a="release">← Back to worklist</button>`;
  }
}

/* ==========================================================================
   SCREEN 0 — INTAKE
   ========================================================================== */
function renderIntake(){
  const opts = Object.keys(SCN).map(k=>`<option value="${k}">${SCN[k].po} — ${SCN[k].vendor.name}${SCN[k].vendor.configured?(SCN[k].vendor.qr?' (QR)':' (Non-QR)'):' (not configured)'}</option>`).join('');
  app().innerHTML = `<div class="card">
    ${hd(0,'Start a consignment','Gate 1 checks the vendor is configured. The QR flag then selects the flow. Nothing physical starts until both pass.')}
    <div class="row">
      <div class="f"><label>Consignment</label><select id="pick">${opts}</select></div>
      <div class="f"><label>Purchase order</label><input id="po"></div>
      <div class="f"><label>Invoice</label><input id="inv"></div>
      <button class="btn pri" data-a="check">Run checks</button>
    </div>
    <div id="out" style="margin-top:14px"></div></div>`;
  const fill=()=>{const c=SCN[$('#pick').value]; $('#po').value=c.po; $('#inv').value=c.inv; $('#out').innerHTML='';};
  $('#pick').onchange=fill; fill();
}
const chk=(ok,t)=>`<span class="pill ${ok?'p-ok':'p-err'}" style="margin:0 6px 6px 0">${ok?'✓':'✕'} ${t}</span>`;
function doCheck(){
  S.key=$('#pick').value; const c=cons();
  let h = `<div class="sec">E42 gate-in &amp; sanity</div><div>${chk(true,'Invoice gated in')}${chk(true,'Vendor found')}${chk(true,'BU found')}${chk(true,'GSTN match')}${chk(true,'PO ↔ location')}</div>
    <div class="sec">Gate 1 — Green Channel configuration</div><div>${chk(c.vendor.configured,'Vendor maintained in dc_qc_config_green_channel')}</div>`;
  if(!c.vendor.configured){
    h += `<div class="msg m-err"><b>✕</b><div><b>Hard block — this consignment cannot be received.</b><br>
      ${c.vendor.name} is not maintained in the Green Channel configuration. Configuration gaps fail closed, never open (CFG-06).
      Ask the Ops team to configure the vendor, then run the checks again.</div></div>`;
    $('#out').innerHTML=h; return;
  }
  h += `<div class="sec">Flow type</div><div>${chk(true, c.vendor.qr?'QR enabled → QR flow':'QR not enabled → Non-QR flow (Phase 1)')}</div>`;
  c.lines.forEach(l=>{ l.ckey=S.key; l.eligible = !!ELIG[l.sku]; l.id = l.id || (S.key+'-'+l.sku); });
  const g = c.lines.filter(l=>l.eligible).length;
  h += `<div class="kpis">${kpi(c.lines.reduce((a,l)=>a+l.invQty,0),'Units invoiced')}${kpi(c.lines.length,'Lines')}
    ${kpi(g,'Skip inspection')}${kpi(c.lines.length-g,'Need QC')}</div>
    <div style="text-align:right"><button class="btn pri" data-a="startQC">Start QC →</button></div>`;
  $('#out').innerHTML=h;
}
function startQC(){
  S.started=true;
  const hrc = lines().find(l=>l.sku==='MRC-HRC-400');
  if(hrc && !hrc.lockedBy && hrc.status==='new') hrc.lockedBy='rohit.op';
  go('worklist');
}

/* ==========================================================================
   SCREEN 1 — WORKLIST + E42 refresh with colour coding
   ========================================================================== */
function renderWorklist(){
  lines().forEach(l=>{ if(l.status==='new') l.eligible=!!ELIG[l.sku]; });
  const rank={new:0,prog:1,prob:1,nsm:1,part:1,qc:2,failed:2,full:3,short:3,removed:4};
  const rows = lines().slice().sort((a,b)=>rank[a.status]-rank[b.status]).map(l=>{
    const ch = l.change && !l.ackChange ? CH_META[l.change.cls] : null;
    const lock = l.lockedBy && l.lockedBy!==S.user;
    const op = openProbs(l).length;
    let act;
    if(l.status==='removed') act = `<span class="note">not receivable</span>`;
    else if(lock) act = `<span class="pill p-grey">🔒 ${l.lockedBy}</span>`;
    else if(['qc','failed'].includes(l.status)) act = `<span class="note">with Team Lead</span>`;
    else if(['full','short'].includes(l.status)) act = `<span class="note">closed</span>`;
    else act = `<button class="btn sm pri" data-a="open" data-id="${l.id}">${l.status==='new'?(l.eligible?'Receive':'Start QC'):'Resume'}</button>`;
    return `<tr class="${ch?ch.cls:''}">
      <td><div style="display:flex;gap:8px;align-items:center">
        <div style="font-size:20px">${l.img}</div>
        <div><div style="font-weight:600">${esc(l.desc)}</div>
        <div class="note">${l.sku} · EAN ${l.ean} · ${l.invQty} units · ${l.pack}/box${l.postedQty?` · posted ${l.postedQty}, remaining ${remaining(l)}`:''}</div>
        ${ch?`<div class="note" style="font-weight:600">${ch.icon} ${ch.label}: ${esc(l.change.field)} ${esc(l.change.from)} → ${esc(l.change.to)}
          <button class="btn sm" data-a="ack" data-id="${l.id}" style="margin-left:6px">Acknowledge</button></div>`:''}
        ${l.e42Note?`<div class="note" style="color:var(--err)">⚠ ${esc(l.e42Note)}</div>`:''}
        ${l.nsm?`<div class="note" style="color:var(--err)">⚠ No SKU Match — ${esc(l.nsm.reason)}</div>`:''}
      </div></div></td>
      <td>${l.eligible?'<span class="pill p-ok">⚡ Skips inspection</span>':'<span class="pill p-warn">🔍 Needs QC</span>'}</td>
      <td>${statPill(l.status)}${l.escalated?'<div class="note" style="color:var(--err)">escalated to 100%</div>':''}</td>
      <td>${op?`<span class="pill p-err">${op}</span>`:'<span class="note">none</span>'}</td>
      <td style="text-align:right">${act}</td></tr>`;
  }).join('');

  app().innerHTML = `<div class="card">
    <div class="hd"><div class="n">1</div><div><h3>Lines on this invoice</h3>
      <p>Routing comes from configuration — it is never an operator choice. One line, one owner at a time.</p></div>
      <div class="spacer"></div><button class="btn" data-a="refresh">↻ Refresh from E42</button></div>
    ${S.refresh?refreshPanel():''}
    <table><thead><tr><th>Line</th><th>Route (Gate 2)</th><th>Status</th><th>Open problems</th><th style="text-align:right">Action</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="sec">E42 change legend — colour is never the only signal</div>
    <div>${Object.values(CH_META).map(m=>`<span class="pill ${m.pill}" style="margin:0 6px 6px 0">${m.icon} ${m.label}</span>`).join('')}</div>
    <div class="note">Refresh is manual only (OI-12). Acknowledgement is per line, per user and session-scoped (E42-10).</div>
  </div>`;
}
function refreshPanel(){
  const r=S.refresh;
  if(r.none) return `<div class="msg m-ok"><b>✓</b><div>E42 checked just now. Nothing has changed on this invoice.</div></div>`;
  const m=CH_META[r.cls];
  const l = r.add ? null : line(S.key+'-'+r.sku);
  const frozen = l && ['qc','failed','part','full','short'].includes(l.status);
  const work = l && (l.boxes.length || IDENT_KEYS.some(k=>l.ident[k]!==null) || l.batches.length);
  let body;
  if(r.add) body = `A new line <b>${r.to}</b> has appeared in E42. It will be added as Not started with Gate 2 evaluated from configuration.`;
  else if(r.del) body = `<b>${r.sku}</b> has been removed in E42. It will be blocked from further QC and cannot be received.${work?' Recorded work is retained for audit.':''}`;
  else if(frozen) body = `<b>${r.sku}</b> — ${r.field} changed ${r.from} → ${r.to}.<br>This line is already with the Team Lead, so <b>nothing recorded will be cleared</b>. It will be flagged as out of step with E42.`;
  else if(work) body = `<b>${r.sku}</b> — ${r.field} changed ${r.from} → ${r.to}.<br><b>Everything recorded against this line will be cleared</b> — ${l.boxes.length} box(es), ${l.batches.length} batch(es), identity checks and its problem records. Other lines are unaffected. This cannot be undone.`;
  else body = `<b>${r.sku}</b> — ${r.field} changed ${r.from} → ${r.to}.<br>Nothing has been recorded against this line yet, so nothing will be lost.`;
  return `<div class="msg m-warn" style="flex-direction:column;align-items:stretch">
    <div><b>${m.icon} ${m.label} detected.</b> Nothing has been applied yet.</div>
    <div style="margin-top:6px">${body}</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri sm" data-a="applyRefresh">${frozen?'Flag and refresh':(r.del?'Apply removal':'Apply and clear this line')}</button>
      <button class="btn sm" data-a="cancelRefresh">Keep what I have</button></div></div>`;
}
function doRefresh(){
  const nxt = E42_QUEUE.find(c=>c.key===S.key);
  if(!nxt){ S.refresh={none:true}; render(); return; }
  S.refresh=nxt; render();
}
function applyRefresh(){
  const r=S.refresh;
  E42_QUEUE = E42_QUEUE.filter(c=>c!==r);
  if(r.add){
    const nl = mkLine({sku:'MRC-BOD-150', ean:mkEan('890123400009'), invQty:48, poQty:48, pack:12,
                       plan:[{vb:'VB-4400', mfg:-100, exp:410}]});
    nl.ckey=S.key; nl.id=S.key+'-MRC-BOD-150'; nl.eligible=!!ELIG['MRC-BOD-150'];
    nl.change={cls:'add', field:'New line', from:'—', to:'MRC-BOD-150'};
    lines().push(nl); toast('New line MRC-BOD-150 added from E42','ok');
  } else {
    const l = line(S.key+'-'+r.sku);
    const frozen = ['qc','failed','part','full','short'].includes(l.status);
    if(r.del){ l.status='removed'; l.change={cls:'del',field:r.field,from:r.from,to:r.to};
      toast(`${r.sku} removed in E42 — blocked from receiving`,'err'); }
    else if(frozen){ r.apply && r.apply(l); l.e42Note=`Out of step with E42 — ${r.field} now ${r.to}. Recorded data kept.`;
      l.change={cls:r.cls,field:r.field,from:r.from,to:r.to}; toast(`${r.sku} flagged out of step with E42`,'err'); }
    else {
      r.apply && r.apply(l);
      const nb=l.boxes.length, nba=l.batches.length;
      l.boxes=[]; l.batches=[]; l.escalated=false; l.physMRP=''; l.rekeyed=false; l.flags=[];
      IDENT_KEYS.forEach(k=>l.ident[k]=null); l.status='new'; l.nsm=null;
      PROBLEMS = PROBLEMS.filter(p=>p.lineId!==l.id);
      l.change={cls:r.cls,field:r.field,from:r.from,to:r.to};
      toast(`${r.sku}: ${nb} box(es) and ${nba} batch(es) cleared — start the line again`,'err');
      if(S.lineId===l.id){ S.lineId=null; }
    }
  }
  S.refresh=null; go('worklist');
}
function openLine(id){
  const l=line(id);
  if(l.status==='removed'){ toast('This line was removed in E42 and cannot be received','err'); return; }
  if(l.lockedBy && l.lockedBy!==S.user){ toast(`Line is open on ${l.lockedBy}'s device`,'err'); return; }
  if(l.nsm){ toast('No SKU Match — resolve identification first','err'); S.lineId=id; go('nsm'); return; }
  l.lockedBy=S.user; if(l.status==='new'||l.status==='part') l.status='prog';
  S.lineId=id; S.pendingQR=null; S.nqForm=null;
  go(l.eligible?'recv':'ident');
}
function release(){ const l=cur(); if(l&&l.lockedBy===S.user&&!['qc','failed','full','short'].includes(l.status)) l.lockedBy=null;
  S.pendingQR=null; S.nqForm=null; go('worklist'); }

/* ==========================================================================
   SCREEN 2 — IDENTITY (5 properties, 3-way MRP, EAN scan, No SKU Match)
   ========================================================================== */
function renderIdent(){
  const l=cur();
  const rows=[['MRP',`Order ₹${l.masterMRP} · invoice ₹${l.invoiceMRP}`],
              ['MFG/EXP','Read the dates printed on the pack'],
              ['SKU',l.sku],['Image','Compare the pack with the master photo'],
              ['Description',esc(l.desc)]].map(([k,ex])=>{
    const st=l.ident[k]; const cls = st==='ok'?'ok': st==='flagged'?'bad':'';
    let ctl;
    if(k==='MRP' && st===null){
      ctl = `<div style="display:flex;gap:6px;align-items:center">₹
        <input class="mini" id="mrpIn" value="${l.physMRP}" placeholder="on pack" style="width:90px">
        <button class="btn sm pri" data-a="mrpChk">Check</button></div>`;
    } else if(st===null){
      ctl = `<button class="btn sm" data-a="attrOk" data-k="${k}">Matches</button>
             <button class="btn sm dan" data-a="attrBad" data-k="${k}">Does not match</button>`;
    } else if(st==='ok'){
      ctl = `<span class="pill p-ok">✓ Confirmed</span>${k==='MRP'?`<span class="note"> ₹${l.physMRP} keyed</span>`:''}
             <button class="btn sm" data-a="attrRst" data-k="${k}">undo</button>`;
    } else {
      ctl = `<span class="pill p-err">⚑ Problem raised</span><button class="btn sm" data-a="attrRst" data-k="${k}">undo</button>`;
    }
    return `<div class="attr ${cls}"><div class="nm">${k}</div><div class="ex">${ex}</div><div>${ctl}</div></div>`;
  }).join('');

  app().innerHTML = `<div class="card">
    ${hd(2,'Check this is the right product','Confirm all five properties against what is physically in front of you. Identical for QR and Non-QR flows.')}
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <div style="font-size:34px">${l.img}</div>
      <div class="kpis" style="flex:1;margin:0">
        ${kpi(l.ean,'EAN')}${kpi(l.poQty,'Ordered')}${kpi(l.invQty,'Invoiced')}${kpi(l.pack,'Units per box')}
      </div></div>

    <div class="sec">EAN scan — additional identification mechanism</div>
    <div class="row">
      <div class="f"><label>Scan or key an EAN / UPC</label><input id="eanIn" placeholder="EAN-13, EAN-8, UPC-A or UPC-E" style="min-width:250px"></div>
      <button class="btn pri" data-a="eanScan">Scan EAN</button>
      <button class="btn sm" data-a="eanFill" data-v="${l.ean}">use correct</button>
      <button class="btn sm" data-a="eanFill" data-v="${E.MULTI}">multi-mapped</button>
      <button class="btn sm" data-a="eanFill" data-v="${E.ORPHAN}">unmapped</button>
      <button class="btn sm" data-a="eanFill" data-v="8901234000018">bad check digit</button>
      <button class="btn sm" data-a="eanFill" data-v="${E.UPCA}">UPC-A of another line</button>
    </div>
    <div id="eanOut" style="margin-top:10px"></div>

    <div class="sec">Five properties</div>${rows}
    <div style="text-align:right;margin:6px 0"><button class="btn sm dan" data-a="multiProb">⚑ Report several problems at once</button></div>
    <div id="flags">${flagsHtml(l)}</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
      <button class="btn pri" data-a="toSample" ${identDone(l)?'':'disabled'}>Continue to Sample QC →</button></div>
    ${!identDone(l)?`<div class="note" style="text-align:right">Confirm all five properties to continue. An open blocking problem no longer prevents closure (RC-10a) but does hold the line here.</div>`:''}
  </div>`;
}
function flagsHtml(l){
  let h='';
  l.flags.forEach(f=>{ h+=`<div class="msg ${f.blk?'m-err':'m-info'}"><b>${f.blk?'!':'i'}</b><div><b>${esc(f.t)}</b><br>${esc(f.x)}</div></div>`; });
  const grp={}; lineProbs(l).forEach(p=>{ (grp[p.gid]=grp[p.gid]||[]).push(p); });
  Object.values(grp).forEach(g=>{
    const p=g[0], blk=g.some(x=>codeOf(x.code).blk), open=p.status==='open';
    const scope = p.uid?`box ${p.uid}` : p.scope==='line'?'whole line':`${p.qty} units`;
    const st = open?'' : `<span class="pill ${p.status==='rtv'?'p-err':'p-ok'}">${p.status==='rtv'?'returning to vendor':p.status==='e42'?'corrected in E42':'closed'}</span>`;
    const acts = open&&blk ? `<div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn sm dan" data-a="pRTV" data-g="${p.gid}">Return to vendor</button>
        <button class="btn sm" data-a="pE42" data-g="${p.gid}">Correct in E42 and refresh</button></div>` : '';
    h+=`<div class="msg ${open&&blk?'m-err':'m-warn'}"><b>⚑</b><div>
      <b>${g.map(x=>x.code).join(' + ')}</b> <span class="note">(${scope})</span> ${st}
      ${p.remarks?`<br>${esc(p.remarks)}`:''}${acts}</div></div>`;
  });
  return h;
}
function eanScan(){
  const l=cur(), raw=$('#eanIn').value.trim();
  const v = validateEan(raw);
  const log = o => SAP_LOG.push(Object.assign({t:new Date(), kind:'EAN scan'}, o));
  if(!v.ok){
    log({raw, outcome:'invalid', why:v.why});
    $('#eanOut').innerHTML=`<div class="msg m-err"><b>✕</b><div><b>${esc(v.why)}</b><br>
      This is a <b>format</b> failure, not an unmapped code — re-scan or key it again. Logged either way (EAN-09).</div></div>`;
    return;
  }
  const hits = EAN_MAP.filter(m=>m.ean===raw);
  if(!hits.length){
    log({raw, sym:v.sym, outcome:'unmapped'});
    $('#eanOut').innerHTML=`<div class="msg m-err"><b>✕</b><div><b>Valid ${v.sym}, but no SKU found for this EAN.</b><br>
      The mapping is held in <span class="mono">dc_qc_ean_sku_map</span>. The line now enters No SKU Match.</div></div>`;
    setNSM(l,'EAN not mapped'); setTimeout(()=>go('nsm'),700); return;
  }
  if(hits.length>1){
    log({raw, sym:v.sym, outcome:'multi-mapped', skus:hits.map(h=>h.sku)});
    $('#eanOut').innerHTML=`<div class="msg m-warn"><b>?</b><div><b>This ${v.sym} maps to more than one SKU.</b> Select the product in front of you — nothing is auto-selected.
      <div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">
      ${hits.map(h=>`<button class="btn sm" data-a="eanPick" data-sku="${h.sku}">${h.sku} — ${esc(SKU_MASTER[h.sku].desc)}</button>`).join('')}
      </div></div></div>`;
    return;
  }
  const sku=hits[0].sku;
  if(sku!==l.sku){
    log({raw, sym:v.sym, outcome:'line mismatch', resolved:sku, line:l.sku});
    $('#eanOut').innerHTML=`<div class="msg m-err"><b>✕</b><div><b>This EAN belongs to ${sku}, not ${l.sku}.</b><br>
      Identity data was not populated. Raise reason code <b>EAN</b>, or focus the correct line.
      <div style="margin-top:7px"><button class="btn sm dan" data-a="openProb" data-c="EAN">Raise EAN problem</button></div></div></div>`;
    return;
  }
  if(l.eanResolved===raw){
    $('#eanOut').innerHTML=`<div class="msg m-info"><b>i</b><div><b>Already scanned.</b> Re-scanning the same EAN on the same line is an idempotent no-op (EAN-07).</div></div>`;
    return;
  }
  l.eanResolved=raw;
  log({raw, sym:v.sym, outcome:'resolved', sku});
  const m=SKU_MASTER[sku];
  $('#eanOut').innerHTML=`<div class="msg m-ok"><b>✓</b><div><b>SKU identified from ${v.sym}.</b>
    <div class="note" style="margin-top:4px">${sku} · ${esc(m.desc)} · master MRP ₹${m.mrp} · ${m.gram} · ${l.pack} units per box</div></div></div>`;
}
function setNSM(l, reason){

/* ---------- 3-way MRP ---------- */
function mrpChk(){
  const l=cur(), v=parseFloat($('#mrpIn').value);
  if(isNaN(v)){ toast('Enter the MRP printed on the pack','err'); return; }
  l.physMRP=v; l.flags=[];
  if(v!==l.masterMRP){
    if(!l.rekeyed){ l.rekeyed=true;
      toast(`₹${v} does not match the order (₹${l.masterMRP}). Re-key to confirm before it holds the line (ID-05).`,'err');
      render(); return; }
    l.ident.MRP='flagged';
    openProblem(['MRP'], null, 'line', `Pack shows ₹${v} but the order says ₹${l.masterMRP}`);
    return;
  }
  if(l.invoiceMRP!==l.masterMRP)
    l.flags.push({blk:true, t:'The invoice states the wrong MRP',
      x:`Pack and order agree at ₹${l.masterMRP}, but the invoice says ₹${l.invoiceMRP}. The goods are right, the paperwork is not — correct it in E42, or return the goods.`});
  if(l.invQty>l.poQty)
    l.flags.push({blk:false, t:'Invoiced more than ordered',
      x:`Invoice covers ${l.invQty} units against an order of ${l.poQty}. Noted for procurement; receiving continues.`});
  l.ident.MRP='ok'; l.rekeyed=false;
  if(l.flags.some(f=>f.blk)) l.status='prob';
  render();
}

function nextPlan(l){ return l.plan[l.boxes.length % l.plan.length]; }
function scanQR(bad){
  const l=cur();
  if(bad){ S.pendingQR={sku:'MRC-XXX-999', ean:E.ORPHAN, mrp:0, vb:'VB-0000', mfg:dOff(-90), exp:dOff(300), pack:l.pack, wrong:true};
    toast('QR read — this box holds a different SKU'); render(); return; }
  const p=nextPlan(l);
  S.pendingQR={sku:l.sku, ean:l.ean, mrp:l.masterMRP, vb:p.vb, mfg:dOff(p.mfg), exp:dOff(p.exp), pack:l.pack};
  render();
}
function scanUID(dup){
  const l=cur(), q=S.pendingQR;
  if(!q){ toast('Scan the box QR first','err'); return; }
  if(q.wrong){ S.pendingQR=null; toast(`This box holds ${q.sku}, not ${l.sku}`,'err');
    openProblem(['EAN'], null, 'box', `Box contained ${q.sku} instead of ${l.sku}`); return; }
  if(dup){ const last=l.boxes[l.boxes.length-1];
    if(!last){ toast('No previous UID to re-scan yet'); return; }
    toast(`UID ${last.uid} is already on a box — nothing counted twice (SQ-04)`,'err'); return; }
  const uid = l.uidPool[l.boxes.length];
  if(!uid){ toast('No further boxes expected on this line'); return; }
  const b = getBatch(l,q.vb);
  const divergent = b && (gap(b.mfg,q.mfg)>CFG.windowDays || gap(b.exp,q.exp)>CFG.windowDays);
  const bt = addBatch(l, q.vb, q.mfg, q.exp);
  // batch carries the earliest MFG and EXP (BR-13b)
  if(q.mfg<bt.mfg) bt.mfg=q.mfg; if(q.exp<bt.exp) bt.exp=q.exp;
  const s=sampling(l);
  const box={uid, vb:q.vb, mfg:q.mfg, exp:q.exp, qty:q.pack, short:0, excess:0, dmg:0, rtv:0,
             insp: inspected(l).length < s.target, probs:[], dmgSrc:null};
  applyPanelDamage(box);
  l.boxes.push(box);
  S.pendingQR=null;
  toast(b?`Box added to batch ${q.vb}`:`New batch ${q.vb} created`, 'ok');
  if(divergent) openProblem(['MFG/EXP'], uid, 'box', `Dates diverge more than ${CFG.windowDays} days from batch ${q.vb} — box stays in the batch (BR-13a)`);
  else render();
}
function applyPanelDamage(box){

}

function nqSave(){
  const l=cur(), f=S.nqForm;
  const vb=$('#nqVB').value.trim(), mfg=$('#nqMFG').value, exp=$('#nqEXP').value;
  const dmg=parseInt($('#nqDmg').value)||0, rtv=parseInt($('#nqRtv').value)||0;
  let bad=false; const set=(id,m)=>{ const e=$(id); if(e){e.textContent=m||'';} if(m) bad=true; };
  set('#e_vb',''); set('#e_mfg',''); set('#e_exp',''); set('#e_dmg',''); set('#e_rtv','');
  if(!vb) set('#e_vb','Vendor Batch is mandatory');
  else if(vb.length>20) set('#e_vb','Maximum 20 characters (OI-16)');
  else if(!f.editing && getBatch(l,vb)) set('#e_vb','Already declared on this SKU — add boxes to the existing batch instead');
  if(!mfg) set('#e_mfg','MFG is mandatory'); else if(daysTo(mfg)>0) set('#e_mfg','MFG cannot be in the future');
  if(!exp) set('#e_exp','EXP is mandatory');
  else if(mfg && new Date(exp)<=new Date(mfg)) set('#e_exp','EXP must be strictly later than MFG');
  else if(daysTo(exp)<0) set('#e_exp','Already expired at receipt — this is a return, not a receipt (EC-21)');
  if(dmg<0) set('#e_dmg','Cannot be negative');
  if(rtv<0) set('#e_rtv','Cannot be negative');
  if(bad) return;
  if(f.editing){ const b=getBatch(l,f.editing); b.vb=vb; b.mfg=mfg; b.exp=exp; b.dmgQty=dmg; b.rtvQty=rtv;
    l.boxes.filter(x=>x.vb===f.editing).forEach(x=>x.vb=vb);
    toast(`Batch ${vb} updated — freshness re-evaluated`,'ok');
  } else { addBatch(l,vb,mfg,exp,{dmgQty:dmg,rtvQty:rtv}); toast(`Batch ${vb} declared`,'ok'); }
  const f2=freshnessAPI(l.sku,exp);
  if(!f2.pass) toast(`Batch ${vb} breaches freshness (${f2.reason}) — the whole batch will route to RVDC`,'err');
  S.nqForm=null; render();
}
function nqScanBox(vb, dup, other){
  const l=cur(), b=getBatch(l,vb), s=sampling(l);
  if(other){ const o=l.batches.find(x=>x.vb!==vb);
    if(!o){ toast('No other batch on this SKU to demonstrate with'); return; }
    const ob=batchBoxes(l,o)[0];
    if(!ob){ toast('The other batch has no boxes yet'); return; }
    toast(`${ob.uid} is already on batch ${o.vb}. SKU + Batch is the unique property of a box — remove it from that batch first (BR-17).`,'err');
    return; }
  if(dup){ const last=batchBoxes(l,b).slice(-1)[0];
    if(!last){ toast('No box scanned into this batch yet'); return; }
    toast(`${last.uid} already scanned — idempotent no-op (NQ-11)`,'err'); return; }
  const uid=l.uidPool[l.boxes.length];
  if(!uid){ toast('All expected boxes are already associated'); return; }
  const box={uid, vb, mfg:b.mfg, exp:b.exp, qty:l.pack, short:0, excess:0, dmg:0, rtv:0,
             insp: inspected(l).length < s.target, probs:[], dmgSrc:null};
  applyPanelDamage(box); l.boxes.push(box);
  toast(`${uid} associated to batch ${vb}${box.insp?' · in the inspection sample':''}`,'ok');
  render();
}

function addProblem(l, codes, uid, scope, qty, remarks, imgs){
  const gid='GRP-'+(++evtSeq);
  codes.forEach(c=>PROBLEMS.push({id:'D-'+(++evtSeq), gid, lineId:l.id, sku:l.sku, uid, scope, code:c, qty,
    remarks, imgs:imgs||0, by:S.user, at:new Date(), status:'open', hist:[{from:'—',to:'open',by:S.user,at:new Date()}]}));
  if(uid){ const b=l.boxes.find(x=>x.uid===uid); if(b) codes.forEach(c=>{ if(!b.probs.includes(c)) b.probs.push(c); }); }
  if(scope==='line') codes.forEach(c=>{ if(IDENT_KEYS.includes(c)) l.ident[c]='flagged'; });
  if(codes.some(c=>codeOf(c).blk) && l.status!=='nsm') l.status='prob';
  return gid;
}
function pSave(){
  const l=cur(), d=S.draft; pStash();
  if(d.codes.some(c=>codeOf(c).img) && d.imgs===0){ toast('Attach at least one photo for Damage','err'); return; }

  if(d.scope==='box'){ uid = d.uid || (l.boxes[0]&&l.boxes[0].uid);
    if(!uid){ toast('Scan the box first, or change the scope','err'); return; }
    const b=l.boxes.find(x=>x.uid===uid); qty=b?b.qty:d.qty; }
  else if(d.scope==='line') qty=l.invQty;
  addProblem(l, d.codes, uid, d.scope, qty, d.remarks, d.imgs);
  toast(`${d.codes.join(' + ')} recorded against ${l.sku}`,'ok');
  go(S.back||'worklist');
}
function resolveGroup(gid, outcome){
  const recs=PROBLEMS.filter(p=>p.gid===gid); if(!recs.length) return;
  const l=line(recs[0].lineId);
  recs.forEach(r=>{ r.hist.push({from:r.status,to:outcome,by:S.user,at:new Date()}); r.status=outcome;
    if(r.scope==='line'&&IDENT_KEYS.includes(r.code)){ l.ident[r.code]=null; if(r.code==='MRP'){l.physMRP='';l.flags=[];} }
    if(r.uid){ const b=l.boxes.find(x=>x.uid===r.uid); if(b) b.probs=b.probs.filter(c=>c!==r.code); } });
  if(outcome==='e42'){
    l.boxes=[]; l.batches=[]; l.escalated=false; l.physMRP=''; l.flags=[]; l.invoiceMRP=l.masterMRP;
    IDENT_KEYS.forEach(k=>l.ident[k]=null); l.status='new'; l.nsm=null;
    toast(`Corrected data pulled from E42 — recorded work on ${l.sku} was cleared. Start the line again.`,'err');
    S.lineId=null; go('worklist'); return;
  }
  if(!openProbs(l).length && l.status==='prob') l.status='prog';
  if(l.nsm){ l.nsm=null; l.status='prog'; }
  toast(`${recs.map(r=>r.code).join(' + ')} marked for return to vendor`,'ok');
  render();
}

  const out=[];

    if(tab==='pending' && ['qc'].includes(l.status)) out.push(l);
    if(tab==='repush' && l.status==='failed') out.push(l);
    if(tab==='completed' && ['part','full','short'].includes(l.status)) out.push(l);
  }));

}

/* ---------- SAP submission (atomic) ---------- */
function submitGR(){
  const sel=tlLines('pending').filter(l=>l.selected);
  if(!sel.length) return;
  const sub={id:'SUB-'+(++subSeq), at:new Date(), by:'teamlead.dock3', lines:sel.map(l=>l.id), state:'submitted', attempt:1};
  SUBS.push(sub);
  // build the payload: SKU + Vendor Batch, never a Batch ID
  const payload={submission:sub.id, lines:sel.map(l=>({
    line:l.id, sku:l.sku, invoiced:l.invQty,
    batches:l.batches.map(b=>{
      const f=freshnessAPI(l.sku,b.exp);
      return {sku:l.sku, vendor_batch:b.vb, mfg:b.mfg, exp:b.exp, qty:batchQty(l,b),
              disposition: f.pass?'TGDC':'RVDC',
              rvdc_freshness_flag: f.pass?undefined:'TBD — field name pending SAP (OI-08a)'};
    })}))};
  SAP_LOG.push({t:new Date(), kind:'GR payload → SAP', data:payload});

  const rejected = sel.find(l=>l.forceErr);
  if(rejected){
    sub.state='rejected'; sub.error=`SKU–SLOC–Plant extension missing for ${rejected.sku}`;
    sel.forEach(l=>l.status='failed');
    SAP_LOG.push({t:new Date(), kind:'SAP response ← rejected', data:{submission:sub.id, error:sub.error,
      note:'Atomic: no line posted, including lines SAP would have accepted (TL-08)'}});
    toast(`Submission rejected — ${rejected.sku}. Nothing posted; the whole submission moved to Repush.`,'err');
    S.tab='repush'; render(); return;
  }
  postSubmission(sub, sel);
  toast(`Submission ${sub.id} posted — ${sel.length} line(s), ${sel.reduce((a,l)=>a+l.grns.length,0)} GRN(s) total`,'ok');
  S.tab='completed'; render();
}
function postSubmission(sub, sel){
  const resp={submission:sub.id, batch_ids:[], grns:[]};
  sel.forEach(l=>{
    // SAP returns exactly ONE batch_id per SKU + Vendor Batch (OI-29)
    l.batches.forEach(b=>{
      const key=bkey(l.sku,b.vb);
      if(!SAP_BATCH_REG[key]) SAP_BATCH_REG[key]='B'+(++sapBatchSeq)+'-'+b.mfg.slice(2,7).replace('-','');
      // simulate one batch where SAP returns nothing -> unresolved, cleared automatically
      if(b.vb==='VB-3311' && !b.sapBatchId && !b.triedOnce){ b.triedOnce=true; b.unresolved=true;
        resp.batch_ids.push({sku:l.sku, vendor_batch:b.vb, batch_id:null, note:'not returned'});
        scheduleBatchIdJob(l,b); return; }
      b.sapBatchId=SAP_BATCH_REG[key]; b.unresolved=false;
      resp.batch_ids.push({sku:l.sku, vendor_batch:b.vb, batch_id:b.sapBatchId});
    });
    const postedNow=l.boxes.reduce((a,b)=>a+sal(b)+b.dmg+b.rtv,0);
    const grn='49'+Math.floor(1000000+Math.random()*8999999);
    l.grns.push(grn); l.postedQty=Math.min(l.invQty, l.postedQty+postedNow);
    resp.grns.push({line:l.id, grn, qty:postedNow});
    l.status = remaining(l)>0 ? 'part' : 'full';
    l.boxes=[]; l.ackShort=false;      // posted boxes leave the working set
    if(l.status==='part'){ l.batches=l.batches.filter(b=>b.sapBatchId||b.unresolved); }
  });
  sub.state='posted'; sub.resp=resp;
  SAP_LOG.push({t:new Date(), kind:'SAP response ← posted', data:resp});
}
function scheduleBatchIdJob(l,b){
  // BID-14: system job re-queries SAP and clears the state automatically
  setTimeout(()=>{
    const key=bkey(l.sku,b.vb);
    b.sapBatchId=SAP_BATCH_REG[key]; b.unresolved=false;
    SAP_LOG.push({t:new Date(), kind:'Batch ID reconciliation job', data:{sku:l.sku, vendor_batch:b.vb, batch_id:b.sapBatchId, note:'cleared automatically, no user action (BID-14)'}});
    toast(`Reconciliation job resolved Batch ID for ${b.vb} → ${b.sapBatchId}`,'ok');
    if(S.role==='tl') render();
  }, 3500);
}

/* ==========================================================================
   REGISTER / DRAWERS
   ========================================================================== */
function renderRegister(){
  const f=S.regFilter;
  const rows=PROBLEMS.filter(p=>!f||p.code===f).map(p=>`<tr>
    <td class="note mono">${p.id}</td><td><span class="pill p-err">${p.code}</span></td>
    <td>${p.sku}<div class="note">${p.uid?'box '+p.uid:p.scope==='line'?'whole line':'part of the line'}</div></td>
    <td>${p.qty}</td><td class="note">${esc(p.remarks)||'—'}</td>
    <td>${p.status==='open'?'<span class="pill p-err">open</span>':p.status==='rtv'?'<span class="pill p-err">returning</span>':p.status==='e42'?'<span class="pill p-ok">corrected in E42</span>':'<span class="pill p-ok">closed'+(p.closedReason?' · '+p.closedReason:'')+'</span>'}
      ${p.status==='open'?`<div style="margin-top:4px"><select data-a="pStatus" data-id="${p.id}">
        <option value="">change status…</option><option value="rtv">Returned to vendor</option>
        <option value="e42">Corrected in E42</option><option value="closed">Closed</option></select></div>`:''}</td>
    <td class="note">${p.by}<br>${p.at.toLocaleTimeString()}<div class="note">${p.hist.length} change(s)</div></td></tr>`).join('');
  app().innerHTML=`<div class="card">
    ${hd(null,'Problems recorded','Everything raised on this dock, held in Manage. Status is manually changeable while the line is unposted.')}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn sm ${!f?'pri':''}" data-a="regF" data-c="">All</button>
      ${CODES.map(c=>`<button class="btn sm ${f===c.c?'pri':''}" data-a="regF" data-c="${c.c}">${c.c}</button>`).join('')}</div>
    ${rows?`<table><thead><tr><th>Ref</th><th>Code</th><th>Line</th><th>Units</th><th>Notes</th><th>Status</th><th>Raised</th></tr></thead><tbody>${rows}</tbody></table>`
      :'<div class="note">Nothing recorded yet.</div>'}
    <div class="note" style="margin-top:10px">Short, Extra and Return are quantity outcomes, not reason codes, so they never appear here (BR-43).</div>
  </div>`;
}
function drawer(html){ $('#drawer').innerHTML=html; $('#drawer').classList.remove('hide'); $('#ovl').classList.remove('hide'); }
function closeDrawer(){ $('#drawer').classList.add('hide'); $('#ovl').classList.add('hide'); }
function openCfg(){
  drawer(`<div style="display:flex;align-items:center"><h3>Configuration</h3><div class="spacer"></div>
    <button class="btn sm" data-a="closeDrawer">Close</button></div>
    <p class="note">dc_qc_config_green_channel — maintained through the configuration panel by the Product team (CFG-09). No deployment needed.</p>
    <div class="f"><label>Sample percentage (% of SKU quantity)</label><input id="cPct" value="${CFG.samplePct}"></div>
    <div class="f" style="margin-top:8px"><label>Sample cap (BOXES — applied after the unit→box conversion)</label><input id="cCap" value="${CFG.sampleCap}"></div>
    <div class="f" style="margin-top:8px"><label>Escalation threshold (% of inspected boxes)</label><input id="cEsc" value="${CFG.escPct}"></div>
    <div class="f" style="margin-top:8px"><label>Batch date-consistency window (days)</label><input id="cWin" value="${CFG.windowDays}"></div>
    <div class="f" style="margin-top:8px"><label>Line lock idle timeout (minutes)</label><input id="cLock" value="${CFG.lockMins}"></div>
    <button class="btn pri" style="margin-top:12px" data-a="saveCfg">Apply configuration</button>
    <div class="sec">Green Channel eligibility (Gate 2)</div>
    ${Object.keys(ELIG).map(k=>`<label style="display:block;font-size:13px;margin-bottom:4px">
      <input type="checkbox" data-a="elig" data-k="${k}" ${ELIG[k]?'checked':''}> ${k} <span class="note">${esc((SKU_MASTER[k]||{}).desc||'')}</span></label>`).join('')}
    <div class="sec">Change audit (dc_qc_config_audit)</div>
    ${CFG_AUDIT.length?CFG_AUDIT.slice().reverse().map(a=>`<div class="note">${a.at.toLocaleTimeString()} — ${a.p}: ${a.from} → ${a.to} by ${a.by}</div>`).join(''):'<div class="note">No changes yet.</div>'}
    <div class="open-pt" style="margin-top:12px">Fails closed: an absent vendor row blocks intake rather than defaulting a line to Green-direct (CFG-06).</div>`);
}
function saveCfg(){
  const set=(p,id,k)=>{ const v=parseInt($(id).value); if(!isNaN(v)&&v!==CFG[k]){ CFG_AUDIT.push({p,from:CFG[k],to:v,by:'product.admin',at:new Date()}); CFG[k]=v; } };
  set('Sample percentage','#cPct','samplePct'); set('Sample cap (boxes)','#cCap','sampleCap');
  set('Escalation threshold','#cEsc','escPct'); set('Batch window','#cWin','windowDays'); set('Lock timeout','#cLock','lockMins');
  toast('Configuration applied — resolved on next evaluation','ok'); closeDrawer(); render();
}
function openSap(){
  drawer(`<div style="display:flex;align-items:center"><h3>SAP &amp; interface log</h3><div class="spacer"></div>
    <button class="btn sm" data-a="closeDrawer">Close</button></div>
    <p class="note">Simulated payloads and responses. Note that outbound payloads carry <b>SKU + Vendor Batch</b> and never a Batch ID.</p>
    ${SAP_LOG.length?SAP_LOG.slice().reverse().map(e=>`<div class="sec">${e.t.toLocaleTimeString()} — ${e.kind}</div>
      <pre>${esc(JSON.stringify(e.data!==undefined?e.data:{raw:e.raw,outcome:e.outcome,sym:e.sym,why:e.why,sku:e.sku,skus:e.skus,resolved:e.resolved,line:e.line},null,1))}</pre>`).join('')
      :'<div class="note">Nothing logged yet.</div>'}`);
}

/* ==========================================================================
   EVENTS
   ========================================================================== */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a, id=t.dataset.id, k=t.dataset.k, c=t.dataset.c, uid=t.dataset.uid, vb=t.dataset.vb;
  const l=S.lineId?cur():null;
  switch(a){
    case 'role': S.role=t.dataset.r;
      S.screen = S.role==='tl'?'tl':(!S.started?'intake':(S.lineId?S.screen:'worklist')); render(); break;
    case 'toIntake': S.role='op'; S.lineId=null; S.refresh=null; S.nqForm=null; S.pendingQR=null; S.screen='intake'; render(); break;
    case 'openReg': S.prev=S.screen; S.screen='reg'; render(); break;
    case 'closeReg': S.screen=S.prev||(S.role==='tl'?'tl':'worklist'); render(); break;
    case 'regF': S.regFilter=c; render(); break;
    case 'openCfg': openCfg(); break;
    case 'saveCfg': saveCfg(); break;
    case 'openSap': openSap(); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'elig': ELIG[k]=t.checked; CFG_AUDIT.push({p:'Eligibility '+k,from:!t.checked,to:t.checked,by:'product.admin',at:new Date()});
      toast(`${k} ${t.checked?'added to':'removed from'} the Green Channel list`); render(); break;
    case 'check': doCheck(); break;
    case 'startQC': startQC(); break;
    case 'refresh': doRefresh(); break;
    case 'applyRefresh': applyRefresh(); break;
    case 'cancelRefresh': S.refresh=null; toast('Change discarded — it can be pulled again later'); render(); break;
    case 'ack': line(id).ackChange=true; toast('Highlight acknowledged — session-scoped, per user (E42-10)'); render(); break;
    case 'open': openLine(id); break;
    case 'release': release(); break;
    case 'eanScan': eanScan(); break;
    case 'eanFill': $('#eanIn').value=t.dataset.v; break;
    case 'eanPick': { const sku=t.dataset.sku;
      if(sku!==l.sku){ $('#eanOut').innerHTML=`<div class="msg m-err"><b>✕</b><div>You selected ${sku}, which is not the SKU on this line (${l.sku}).</div></div>`; }
      else { l.eanResolved=$('#eanIn').value.trim(); $('#eanOut').innerHTML=`<div class="msg m-ok"><b>✓</b><div><b>${sku} selected.</b> Identity data populated.</div></div>`; }
      break; }
    case 'mrpChk': mrpChk(); break;
    case 'attrOk': l.ident[k]='ok'; render(); break;
    case 'attrBad': openProblem([k], null, 'line', ''); break;
    case 'attrRst': l.ident[k]=null; if(k==='MRP'){l.physMRP='';l.rekeyed=false;l.flags=[];} render(); break;
    case 'multiProb': openProblem([], null, 'line', ''); break;
    case 'openProb': openProblem([c], null, 'line', ''); break;
    case 'openProbBox': openProblem(['Damage'], uid, 'box', ''); break;
    case 'toSample': go('sample'); break;
    case 'toRecv': go('recv'); break;
    case 'scanQR': scanQR(!!t.dataset.bad); break;
    case 'scanUID': scanUID(!!t.dataset.dup); break;
    case 'recvScan': recvScanNQ(); break;
    case 'clearFlag': { const b=l.boxes.find(x=>x.uid===uid);
      b.dmgSrc='cleared'; b.panelFlag=false;
      PROBLEMS.push({id:'D-'+(++evtSeq), gid:'GRP-'+(++evtSeq), lineId:l.id, sku:l.sku, uid, scope:'box', code:'Damage',
        qty:0, remarks:'Unloading flag cleared by operator — box found intact (override, reason mandatory)', imgs:0,
        by:S.user, at:new Date(), status:'closed', closedReason:'override', hist:[{from:'—',to:'closed',by:S.user,at:new Date()}]});
      toast(`${uid}: unloading flag cleared with a reason. The original panel value is retained in audit (DMG-06).`,'ok'); render(); break; }
    case 'closeLine': closeLine(); break;
    case 'nqAdd': S.nqForm={vb:'', mfg:dOff(-120), exp:dOff(400), dmgQty:0, rtvQty:0, editing:null}; render(); break;
    case 'nqEdit': { const b=getBatch(l,vb); S.nqForm={vb:b.vb,mfg:b.mfg,exp:b.exp,dmgQty:b.dmgQty,rtvQty:b.rtvQty,editing:b.vb}; render(); break; }
    case 'nqDel': { const b=getBatch(l,vb);
      if(batchBoxes(l,b).length){ toast(`Batch ${vb} holds ${batchBoxes(l,b).length} box(es) — remove them before deleting (NQ-15)`,'err'); break; }
      l.batches=l.batches.filter(x=>x.vb!==vb); toast(`Batch ${vb} deleted`,'ok'); render(); break; }
    case 'nqCancel': S.nqForm=null; render(); break;
    case 'nqSave': nqSave(); break;
    case 'nqPreset': { const p=t.dataset.p, f=S.nqForm;
      if(p==='good'){ f.vb=f.vb||'VB-SUN-01'; f.mfg=dOff(-120); f.exp=dOff(400); }
      if(p==='stale'){ f.vb=f.vb||'VB-SUN-02'; f.mfg=dOff(-400); f.exp=dOff(30); }
      if(p==='expired'){ f.vb=f.vb||'VB-SUN-03'; f.mfg=dOff(-500); f.exp=dOff(-10); }
      if(p==='inverted'){ f.vb=f.vb||'VB-SUN-04'; f.mfg=dOff(-10); f.exp=dOff(-100); }
      render(); break; }
    case 'nqScanBox': nqScanBox(vb, !!t.dataset.dup, !!t.dataset.other); break;
    case 'pCode': { pStash(); const i=S.draft.codes.indexOf(c); i>=0?S.draft.codes.splice(i,1):S.draft.codes.push(c); render(); break; }
    case 'pScope': pStash(); S.draft.scope=t.dataset.s; render(); break;
    case 'pScanBox': { pStash(); const uidN=l.uidPool[l.boxes.length];
      const b0=l.batches[0]||addBatch(l,'VB-TMP',dOff(-100),dOff(400));
      const box={uid:uidN, vb:b0.vb, mfg:b0.mfg, exp:b0.exp, qty:l.pack, short:0,excess:0,dmg:0,rtv:0,insp:false,probs:[],dmgSrc:null};
      applyPanelDamage(box); l.boxes.push(box); S.draft.uid=uidN;
      toast(`${uidN} scanned for this report`,'ok'); render(); break; }
    case 'pImg': pStash(); S.draft.imgs = S.draft.imgs>=3?0:S.draft.imgs+1; render(); break;
    case 'pCancel': go(S.back||'worklist'); break;
    case 'pSave': pSave(); break;
    case 'pRTV': resolveGroup(t.dataset.g,'rtv'); break;
    case 'pE42': resolveGroup(t.dataset.g,'e42'); break;
    case 'nsmReason': l.nsm.reason=$('#nsmR').value; toast('Reason updated','ok'); render(); break;
    case 'nsmRetry': { const ok=t.dataset.ok==='1';
      l.nsm.tries.push(`${new Date().toLocaleTimeString()} — retry ${ok?'resolved':'failed'} (${S.user})`);
      if(ok){ PROBLEMS.filter(p=>p.lineId===l.id&&p.code==='SKU'&&p.status==='open').forEach(p=>{p.status='closed';p.closedReason='resolved on retry';p.hist.push({from:'open',to:'closed',by:S.user,at:new Date()});});
        l.nsm=null; l.status='prog'; l.ident.SKU='ok'; toast('SKU identified — line unblocked, all attempts retained in audit','ok'); go('ident'); }
      else { toast('Retry failed — logged, line stays blocked','err'); render(); } break; }
    case 'nsmEsc': l.nsm.tries.push(`${new Date().toLocaleTimeString()} — escalated to Team Lead`);
      toast('Escalated — visible to the Team Lead, line stays blocked','err'); render(); break;
    case 'nsmRTV': { const g=PROBLEMS.find(p=>p.lineId===l.id&&p.code==='SKU'&&p.status==='open');
      if(g) resolveGroup(g.gid,'rtv'); l.nsm=null; l.status='prob'; toast('Marked for return to vendor — excluded from GR','ok'); go('worklist'); break; }
    case 'nsmE42': { const g=PROBLEMS.find(p=>p.lineId===l.id&&p.code==='SKU'&&p.status==='open');
      if(g) resolveGroup(g.gid,'e42'); break; }
    case 'nsmMD': l.nsm.tries.push(`${new Date().toLocaleTimeString()} — master-data request raised off-system`);
      toast('Manual off-system step — no tracked request is created (OI-05)'); render(); break;
    case 'tab': S.tab=t.dataset.t; render(); break;
    case 'exp': S.open[k+S.tab]=!S.open[k+S.tab]; render(); break;
    case 'selInv': { tlLines(S.tab).filter(x=>x.ckey===k).forEach(x=>x.selected=t.checked); render(); break; }
    case 'selLine': line(id).selected=t.checked; render(); break;
    case 'forceErr': line(id).forceErr=t.checked; break;
    case 'submit': submitGR(); break;
    case 'repushOne': { const ln=line(id); ln.forceErr=false;
      const sub=SUBS.filter(x=>x.state==='rejected').find(x=>x.lines.includes(ln.id));
      if(!sub){ toast('No rejected submission for that line'); break; }
      const set=sub.lines.map(x=>line(x)).filter(x=>x&&!x.forceErr);
      sub.attempt++; postSubmission(sub,set);
      toast(`${sub.id} reposted on attempt ${sub.attempt}`,'ok'); S.tab='completed'; render(); break; }
    case 'repushAll': { SUBS.filter(x=>x.state==='rejected').forEach(sub=>{
        const set=sub.lines.map(x=>line(x)).filter(Boolean); set.forEach(x=>x.forceErr=false);
        sub.attempt++; postSubmission(sub,set); });
      toast('All rejected submissions reposted','ok'); S.tab='completed'; render(); break; }
    case 'shortClose': { const ln=line(id);
      ln.shortClosed=`balance of ${remaining(ln)} units will not arrive`; ln.status='short';
      toast(`${ln.sku} short-closed with a reason — no further receiving (TL-20)`,'ok'); render(); break; }
  }
});
document.addEventListener('change', e=>{
  const t=e.target.closest('[data-a="pStatus"]'); if(!t||!t.value) return;
  const p=PROBLEMS.find(x=>x.id===t.dataset.id);
  p.hist.push({from:p.status,to:t.value,by:S.user,at:new Date()}); p.status=t.value;
  toast(`${p.code} status changed to ${t.value} — logged with previous value (PR-11)`,'ok'); render();
});
document.addEventListener('input', e=>{
  const el=e.target; if(!el.dataset.fld) return;
  const l=cur(); if(!l) return;
  const b=l.boxes.find(x=>x.uid===el.dataset.uid); if(!b) return;
  const v=Math.max(0,parseInt(el.value)||0);
  b[el.dataset.fld]=v;
  if(b.dmg+b.rtv > b.qty){ toast(`Damaged + Return cannot exceed the box quantity of ${b.qty} (BR-18)`,'err');
    b[el.dataset.fld]=0; render(); return; }
  if(S.screen==='sample'){ const r=defectRate(l);
    if(!l.escalated && r>CFG.escPct){ l.escalated=true;
      toast(`Problem rate ${r}% exceeds ${CFG.escPct}% — line escalated, every box must now be inspected`,'err'); } }
  render();
});

/* boot */
render();
</script>
